name: One-shot RunRecs auth host repair

on:
  push:
    branches:
      - fix/runrecs-google-auth-hosts

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[runrecs-auth-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runrecs-google-auth-hosts
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Approve RunRecs hosts and document exact Google callbacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path("src/lib/auth/server.ts")
          text = server.read_text()
          old_comment = '''// BETTER_AUTH_URL is a canonical fallback. The actual approved Athrecs hostname
          // is resolved per request so public and staff sessions remain host-only.'''
          new_comment = '''// BETTER_AUTH_URL is a canonical fallback. The actual approved SportsRecs
          // network hostname is resolved per request so sessions remain host-only.'''
          if old_comment not in text:
              raise SystemExit("Auth base-URL comment anchor was not found")
          text = text.replace(old_comment, new_comment, 1)

          old_hosts = '''const ATHRECS_DEPLOYED_AUTH_HOSTS: string[] = [
            "www.athrecs.com",
            "athrecs.com",
            "update.athrecs.com",
          ];'''
          new_hosts = '''const DEPLOYED_AUTH_HOSTS: string[] = [
            "www.athrecs.com",
            "athrecs.com",
            "update.athrecs.com",
            "www.runrecs.com",
            "runrecs.com",
          ];'''
          if old_hosts not in text:
              raise SystemExit("Deployed auth host allowlist anchor was not found")
          text = text.replace(old_hosts, new_hosts, 1)
          text = text.replace("ATHRECS_DEPLOYED_AUTH_HOSTS", "DEPLOYED_AUTH_HOSTS")
          server.write_text(text)

          env_file = Path(".env.example")
          text = env_file.read_text()
          old_base = '''VITE_AUTH_ENABLED=true
          BETTER_AUTH_URL=https://www.athrecs.com
          BETTER_AUTH_SECRET='''
          new_base = '''VITE_AUTH_ENABLED=true
          # Use https://www.runrecs.com in the separate RunRecs production project.
          BETTER_AUTH_URL=https://www.athrecs.com
          BETTER_AUTH_SECRET='''
          if old_base not in text:
              raise SystemExit("BETTER_AUTH_URL example anchor was not found")
          text = text.replace(old_base, new_base, 1)

          old_google = '''# Google. Register these callback URLs:
          # https://www.athrecs.com/api/auth/callback/google
          # https://athrecs.com/api/auth/callback/google
          # https://update.athrecs.com/api/auth/callback/google'''
          new_google = '''# Google. Register these exact callback URLs on the shared OAuth client:
          # https://www.athrecs.com/api/auth/callback/google
          # https://athrecs.com/api/auth/callback/google
          # https://update.athrecs.com/api/auth/callback/google
          # https://www.runrecs.com/api/auth/callback/google
          # https://runrecs.com/api/auth/callback/google'''
          if old_google not in text:
              raise SystemExit("Google callback example anchor was not found")
          env_file.write_text(text.replace(old_google, new_google, 1))

          docs = Path("docs/authentication/README.md")
          text = docs.read_text()
          old_callback = '''Every activated provider must register its exact Better Auth callback path on both public hosts:

          ```text
          https://www.athrecs.com/api/auth/callback/<provider>
          https://athrecs.com/api/auth/callback/<provider>
          ```

          Google additionally retains the staff callback:

          ```text
          https://update.athrecs.com/api/auth/callback/google
          ```'''
          new_callback = '''Every activated provider must register its exact Better Auth callback path on both ATHRECS public hosts:

          ```text
          https://www.athrecs.com/api/auth/callback/<provider>
          https://athrecs.com/api/auth/callback/<provider>
          ```

          RunRecs uses the same account database and OAuth application, but its callbacks are separate exact URLs:

          ```text
          https://www.runrecs.com/api/auth/callback/<provider>
          https://runrecs.com/api/auth/callback/<provider>
          ```

          Google additionally retains the staff callback:

          ```text
          https://update.athrecs.com/api/auth/callback/google
          ```

          The exact RunRecs Google redirect URIs are:

          ```text
          https://www.runrecs.com/api/auth/callback/google
          https://runrecs.com/api/auth/callback/google
          ```

          In Google Cloud, the shared web client must also list these Authorized JavaScript origins with no path:

          ```text
          https://www.runrecs.com
          https://runrecs.com
          ```

          The separate RunRecs Vercel project must use `BETTER_AUTH_URL=https://www.runrecs.com` and copy the same `DATABASE_URL`, `BETTER_AUTH_SECRET`, `GOOGLE_CLIENT_ID` and `GOOGLE_CLIENT_SECRET` as ATHRECS. Redirect the apex host to `www` while retaining both exact Google callbacks.'''
          if old_callback not in text:
              raise SystemExit("Authentication callback documentation anchor was not found")
          docs.write_text(text.replace(old_callback, new_callback, 1))

          verify = Path("scripts/verify-auth-methods.mjs")
          text = verify.read_text()
          anchor = '''assert.match(server, /generateAppleClientSecret/);
          assert.match(server, /dsaEncoding:\\s*["']ieee-p1363["']/);

          for (const provider of ['''
          replacement = '''assert.match(server, /generateAppleClientSecret/);
          assert.match(server, /dsaEncoding:\\s*["']ieee-p1363["']/);

          for (const runRecsHost of ["www.runrecs.com", "runrecs.com"]) {
            assert.ok(server.includes(`"${runRecsHost}"`), `${runRecsHost} auth host missing`);
            const callback = `https://${runRecsHost}/api/auth/callback/google`;
            assert.ok(envExample.includes(callback), `${runRecsHost} env callback missing`);
            assert.ok(docs.includes(callback), `${runRecsHost} callback docs missing`);
          }
          assert.match(docs, /Authorized JavaScript origins/);
          assert.ok(docs.includes("BETTER_AUTH_URL=https://www.runrecs.com"));

          for (const provider of ['''
          if anchor not in text:
              raise SystemExit("Authentication verification anchor was not found")
          verify.write_text(text.replace(anchor, replacement, 1))
          PY

      - name: Verify authentication configuration and types
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run verify:auth-methods
          npm run typecheck

      - name: Commit the reviewed repair
        shell: bash
        run: |
          git config user.name "athrecs-ci"
          git config user.email "athrecs-ci@users.noreply.github.com"
          git add src/lib/auth/server.ts .env.example docs/authentication/README.md scripts/verify-auth-methods.mjs
          git commit -m "Approve RunRecs Google auth hosts [runrecs-auth-fix]"
          git push origin HEAD:fix/runrecs-google-auth-hosts
