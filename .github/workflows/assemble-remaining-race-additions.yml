name: Assemble remaining verified race additions

on:
  push:
    branches:
      - release/all-remaining-race-additions-2026-08-28

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor == 'brownep77'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/all-remaining-race-additions-2026-08-28
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Fetch reviewed source branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            agent/release-64a-uk-10k-checkpoint:refs/remotes/origin/agent/release-64a-uk-10k-checkpoint \
            codex/uk-ireland-nonstandard-distances:refs/remotes/origin/codex/uk-ireland-nonstandard-distances \
            agent/uk-ireland-half-ten-mile-scan-2026-08-25:refs/remotes/origin/agent/uk-ireland-half-ten-mile-scan-2026-08-25

      - name: Apply verified Release 64A-64B UK 10K data
        shell: bash
        run: |
          set -euo pipefail
          source_ref=origin/agent/release-64a-uk-10k-checkpoint
          merge_base="$(git merge-base origin/main "$source_ref")"
          git diff --binary "$merge_base".."$source_ref" -- \
            src/data/entry-options-uk-10ks.ts \
            src/data/venue-details.ts \
            > /tmp/release-64.patch
          test -s /tmp/release-64.patch
          git apply --3way --index /tmp/release-64.patch

      - name: Import reviewed non-standard and 2027 race datasets
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/codex/uk-ireland-nonstandard-distances -- \
            src/data/non-standard-races-uk-ireland.ts \
            scripts/verify-uk-ireland-non-standard-distances.mjs
          git checkout origin/agent/uk-ireland-half-ten-mile-scan-2026-08-25 -- \
            src/data/half-ten-mile-races-uk-ireland-daily-followup.ts \
            scripts/verify-uk-ireland-half-ten-mile-daily-followup.mjs \
            docs/uk-ireland-half-ten-mile-daily-followup.md
          node scripts/assemble-remaining-race-additions.mjs
          python - <<'PY'
          from pathlib import Path
          import re

          replacement = '/const SEED_VERSION = "athrecs-[^"]+";/.test(seedSource)'
          for name in (
              'scripts/verify-uk-ireland-half-ten-mile-daily-followup.mjs',
              'scripts/verify-uk-ireland-non-standard-distances.mjs',
          ):
              path = Path(name)
              text = path.read_text()
              text, count = re.subn(
                  r"seedSource\.includes\('const SEED_VERSION = \"athrecs-[^\"]+\"'\)",
                  replacement,
                  text,
              )
              if count > 1:
                  raise SystemExit(f'{name}: expected at most one seed-version assertion, found {count}')
              if count == 0 and replacement not in text:
                  raise SystemExit(f'{name}: did not contain a recognised seed-version assertion')
              path.write_text(text)
          PY
          git add -A

      - name: Verify assembled catalogue
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint
          npm run verify:uk-10k-workflow
          npm run verify:uk-ireland-half-ten-mile-daily
          npm run verify:uk-ireland-non-standard-distances
          npm run verify:fixture-duplicates
          npm run build

      - name: Commit verified release and remove temporary assembly files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ATHRECS Release Automation"
          git config user.email "paultwbrowne@gmail.com"
          rm .github/workflows/assemble-remaining-race-additions.yml
          rm scripts/assemble-remaining-race-additions.mjs
          git add -A
          git commit -m "Add all remaining verified UK and Ireland race additions"
          git push origin HEAD:release/all-remaining-race-additions-2026-08-28
