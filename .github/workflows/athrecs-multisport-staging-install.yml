name: Install Athrecs multi-sport backend on staging branch

on:
  push:
    branches:
      - agent/multisport-backend
    paths:
      - ".github/workflows/athrecs-multisport-staging-install.yml"
      - ".staging/apply-serialization-patch.py"
      - ".staging/athrecs-multisport-backend.zip.b64.part-*"

permissions:
  contents: write

concurrency:
  group: athrecs-multisport-staging-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multisport-backend
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .staging/athrecs-multisport-backend.zip.b64.part-* \
            | tr -d '\n' \
            | base64 --decode \
            > /tmp/athrecs-multisport-backend.zip
          echo "916c4f2993842d42fff12702d8cb5585a48a4467bf504c08e44370f322059bce  /tmp/athrecs-multisport-backend.zip" \
            | sha256sum -c -
          rm -rf /tmp/athrecs-multisport-bundle
          mkdir -p /tmp/athrecs-multisport-bundle
          unzip -q /tmp/athrecs-multisport-backend.zip \
            -d /tmp/athrecs-multisport-bundle
          chmod +x /tmp/athrecs-multisport-bundle/athrecs-multisport-backend/install-into-repo.sh
          /tmp/athrecs-multisport-bundle/athrecs-multisport-backend/install-into-repo.sh \
            "$GITHUB_WORKSPACE"

      - name: Apply TanStack serialization compatibility patch
        run: python3 .staging/apply-serialization-patch.py

      - name: Install dependencies
        run: npm ci

      - name: Verify backend structure
        run: node scripts/verify-multisport-backend.mjs

      - name: Type-check and preserve complete diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck > .staging/typecheck.log 2>&1
          status=$?
          cat .staging/typecheck.log
          if [ "$status" -ne 0 ]; then
            git config user.name "ATHRECS Staging Installer"
            git config user.email "agent@athrecs.com"
            git add -f .staging/typecheck.log
            git commit -m "Record staging typecheck diagnostics"
            git push origin HEAD:agent/multisport-backend
            exit "$status"
          fi

      - name: Build and preserve complete diagnostics
        shell: bash
        run: |
          set +e
          npm run build > .staging/build.log 2>&1
          status=$?
          cat .staging/build.log
          if [ "$status" -ne 0 ]; then
            git config user.name "ATHRECS Staging Installer"
            git config user.email "agent@athrecs.com"
            git add -f .staging/build.log
            git commit -m "Record staging build diagnostics"
            git push origin HEAD:agent/multisport-backend
            exit "$status"
          fi

      - name: Commit verified staging backend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .staging
          rm -f .github/workflows/athrecs-multisport-staging-install.yml
          rmdir .github/workflows 2>/dev/null || true
          git config user.name "ATHRECS Staging Installer"
          git config user.email "agent@athrecs.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add verified multi-sport athlete and organiser backend"
          git push origin HEAD:agent/multisport-backend
