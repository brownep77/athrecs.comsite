name: One-shot RunRecs alias verifier repair

on:
  push:
    branches:
      - fix/runrecs-gap-fill-types
    paths:
      - .github/workflows/repair-runrecs-alias-verifier.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/runrecs-gap-fill-types

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply asserted verifier repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/verify-fixture-duplicates.mjs")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'(?m)^(?P<i>\s*)\{ englandAthleticsUkFixturesEditions, englandAthleticsUkFixturesSeries \},\n(?P=i)marathonOptions,'
          )
          text, count = pattern.subn(
              lambda m: (
                  f'{m.group("i")}{{ englandAthleticsUkFixturesEditions, englandAthleticsUkFixturesSeries }},\n'
                  f'{m.group("i")}{{ runrecsGapFillSeries }},\n'
                  f'{m.group("i")}{{ ukFiveKSeries }},\n'
                  f'{m.group("i")}marathonOptions,'
              ),
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Expected one destructuring anchor; found {count}")

          pattern = re.compile(
              r'(?m)^(?P<i>\s*)import\("\.\./src/data/england-athletics-uk-fixtures\.ts"\),\n(?P=i)import\("\.\./src/data/entry-options-uk-marathons\.ts"\),'
          )
          text, count = pattern.subn(
              lambda m: (
                  f'{m.group("i")}import("../src/data/england-athletics-uk-fixtures.ts"),\n'
                  f'{m.group("i")}import("../src/data/runrecs-gap-fill-2026-09.ts"),\n'
                  f'{m.group("i")}import("../src/data/uk-5k-races.ts"),\n'
                  f'{m.group("i")}import("../src/data/entry-options-uk-marathons.ts"),'
              ),
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Expected one import anchor; found {count}")

          alias_pattern = re.compile(
              r'''const seriesBySlug = new Map\(seriesList\.map\(\(series\) => \[series\.slug, series\]\)\);\nfor \(const \[alias, canonical\] of Object\.entries\(verifiedFixtureAliases\)\) \{\n\s*assert\(!seriesBySlug\.has\(alias\), `Retired duplicate remains in catalogue: \$\{alias\}`\);\n\s*assert\(seriesBySlug\.has\(canonical\), `Duplicate alias has no canonical event: \$\{canonical\}`\);\n\}'''
          )
          alias_replacement = '''const seriesBySlug = new Map(seriesList.map((series) => [series.slug, series]));
          const aliasCanonicalSeriesBySlug = new Map(
            [...seriesList, ...runrecsGapFillSeries, ...ukFiveKSeries].map((series) => [
              series.slug,
              series,
            ]),
          );
          for (const [alias, canonical] of Object.entries(verifiedFixtureAliases)) {
            assert(!seriesBySlug.has(alias), `Retired duplicate remains in catalogue: ${alias}`);
            assert(
              aliasCanonicalSeriesBySlug.has(canonical),
              `Duplicate alias has no canonical event: ${canonical}`,
            );
          }'''
          text, count = alias_pattern.subn(alias_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected one alias assertion block; found {count}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Verify lint
        run: npm run lint

      - name: Verify fixture duplicate protection
        run: npm run verify:fixture-duplicates

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-runrecs-alias-verifier.yml
          git add scripts/verify-fixture-duplicates.mjs
          git commit -m "Cover RunRecs canonical sources in duplicate verifier"
          git push origin HEAD:fix/runrecs-gap-fill-types
