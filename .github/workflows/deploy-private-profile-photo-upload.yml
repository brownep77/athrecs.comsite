name: Prepare private profile photo upload for deployment

on:
  push:
    branches:
      - codex/private-athlete-profile-photo
    paths:
      - .github/workflows/deploy-private-profile-photo-upload.yml

permissions:
  contents: write

jobs:
  sync-verify-and-push:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athrecs_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athrecs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/athrecs_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/private-athlete-profile-photo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Merge current main and retain both quality gates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          unresolved=$(git diff --name-only --diff-filter=U || true)
          if echo "$unresolved" | grep -qx "package.json"; then
            git checkout --theirs package.json
          fi
          if echo "$unresolved" | grep -qx "package-lock.json"; then
            git checkout --ours package-lock.json
          fi

          node scripts/sync-profile-photo-upload-with-main.mjs
          node scripts/enable-profile-photo-upload-fallback.mjs
          git add package.json package-lock.json src/lib/athrecs/athlete-account-api.ts

          unresolved=$(git diff --name-only --diff-filter=U || true)
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge paths:"
            echo "$unresolved"
            exit 1
          fi
          if [ "$merge_status" -ne 0 ]; then
            echo "Expected package conflict resolved deterministically."
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete quality gate
        run: npm run ci:verify
      - name: Remove one-off deployment helpers
        run: |
          rm scripts/enable-profile-photo-upload-fallback.mjs
          rm scripts/sync-profile-photo-upload-with-main.mjs
          rm .github/workflows/deploy-private-profile-photo-upload.yml
      - name: Commit synchronized upload feature
        run: |
          git add -A
          git commit -m "Enable private Athlete Profile photo uploads"
          git push origin HEAD:codex/private-athlete-profile-photo
