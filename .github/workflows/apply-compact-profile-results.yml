name: Apply compact private profile results

on:
  push:
    branches:
      - codex/compact-profile-results
    paths:
      - .github/workflows/apply-compact-profile-results.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    # Re-run after verifier alignment.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: athrecs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d athrecs_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/athrecs_test
      BETTER_AUTH_URL: http://127.0.0.1:8080
      BETTER_AUTH_SECRET: compact-profile-results-test-secret-32-characters
      VITE_AUTH_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/compact-profile-results
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Integrate compact profile result controls
        run: node scripts/apply-compact-profile-results.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete quality gate
        run: npm run ci:verify
      - name: Remove one-off integration helpers
        run: |
          rm scripts/apply-compact-profile-results.mjs
          rm .github/workflows/apply-compact-profile-results.yml
      - name: Commit verified profile result experience
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            package.json \
            src/routes/my-athlete-profile.tsx \
            src/lib/athrecs/athlete-bio-api.ts \
            src/components/athletes/AthleteResultsSection.tsx \
            scripts/apply-compact-profile-results.mjs \
            .github/workflows/apply-compact-profile-results.yml
          if git diff --cached --quiet; then
            echo "No integration changes"
          else
            git commit -m "Add compact removable Athlete Profile results"
            git push origin HEAD:codex/compact-profile-results
          fi
