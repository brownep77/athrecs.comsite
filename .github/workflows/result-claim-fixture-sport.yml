name: One-shot result-claim sport fixture repair

on:
  push:
    branches:
      - feat/athrecs-athletics-only

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/athrecs-athletics-only
          fetch-depth: 0

      - name: Repair the test fixture
        run: python scripts/fix-result-claim-test-sport.py

      - name: Commit the repair when required
        shell: bash
        run: |
          git config user.name "athrecs-ci"
          git config user.email "athrecs-ci@users.noreply.github.com"
          git add scripts/verify-result-claims.mjs
          if git diff --cached --quiet; then
            echo "Result-claim fixture already includes sport."
            exit 0
          fi
          git commit -m "Add sport to result-claim test fixture [claim-test-sport]"
          git push origin HEAD:feat/athrecs-athletics-only
