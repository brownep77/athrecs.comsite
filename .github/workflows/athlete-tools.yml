name: Athlete tools and single-profile links
on:
  pull_request:
    paths:
      - 'src/lib/athlete-link/**'
      - 'src/components/admin/AthleteTools.tsx'
      - 'src/components/admin/SingleAthleteLink.tsx'
      - 'src/components/admin/AthleteDirectory.tsx'
      - 'src/components/admin/ImportRaceResults.tsx'
      - 'src/routes/admin/athlete-tools.tsx'
      - 'src/lib/athrecs/result-claim*'
      - 'src/lib/auth/email.server.ts'
      - 'src/components/staff/ClaimAlertStatus.tsx'
      - 'src/components/athletes/PotentialResultMatchesPanel.tsx'
      - 'src/routes/admin/result-claims.tsx'
      - 'src/routes/claim-results.tsx'
      - 'src/routes/join.tsx'
      - 'src/routes/admin/result-archive.tsx'
      - 'src/routes/my-athlete-profile.tsx'
      - 'src/routes/api/result-claim-alerts.ts'
      - 'migrations/20261005_result_claim_alerts.sql'
      - 'scripts/verify-result-conflict-*.mjs'
      - 'scripts/verify-signup-ownership.mjs'
      - 'scripts/verify-recruitment-ui.mjs'
      - 'vercel.json'
      - 'scripts/verify-athlete-link.mjs'
      - 'scripts/verify-athlete-tools-browser.mjs'
      - '.github/workflows/athlete-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: athlete-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  claims-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: athrecs_claim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athrecs_claim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ''
      ATHRECS_CLAIM_TEST_POSTGRES: '1'
      VITE_SITE_BRAND: athrecs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Actual concurrent claims and alert workers
        run: node scripts/verify-result-conflict-flow.mjs
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ''
      VITE_SITE_BRAND: athrecs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Private creation, matching, access and transaction checks
        run: node scripts/verify-athlete-link.mjs
      - name: Collected results, registration matching and durable conflict alerts
        run: node scripts/verify-result-conflict-flow.mjs
      - name: Signup abuse cases and ownership authorization
        run: node scripts/verify-signup-ownership.mjs
      - name: Build without database migration or publication hooks
        run: npx vite build --mode development
      - run: npm run typecheck
      - run: npx eslint src/lib/athlete-link/ src/components/admin/AthleteTools.tsx src/components/admin/SingleAthleteLink.tsx src/components/admin/AthleteDirectory.tsx src/components/admin/ImportRaceResults.tsx src/routes/admin/athlete-tools.tsx scripts/verify-athlete-link.mjs scripts/verify-athlete-tools-browser.mjs
      - name: Install isolated browser tools
        run: npm install --prefix "$RUNNER_TEMP/athlete-tools-browser" --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install browser
        run: node "$RUNNER_TEMP/athlete-tools-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Desktop and mobile interactions
        env:
          ATHRECS_BROWSER_MODULE: ${{ runner.temp }}/athlete-tools-browser/node_modules/playwright
        run: node scripts/verify-athlete-tools-browser.mjs
      - name: Conflict review and email retry interface
        env:
          ATHRECS_BROWSER_MODULE: ${{ runner.temp }}/athlete-tools-browser/node_modules/playwright
        run: node scripts/verify-result-conflict-browser.mjs
      - name: LinkedIn entry to email signup and potential results
        env:
          ATHRECS_BROWSER_MODULE: ${{ runner.temp }}/athlete-tools-browser/node_modules/playwright
        run: node scripts/verify-recruitment-ui.mjs --signup-only --linkedin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athlete-tools-preview
          path: |
            artifacts/athlete-tools-*.png
            artifacts/result-conflicts-*.png
            artifacts/recruitment-*.png
            artifacts/funnel-audit/signup-ownership.json
          if-no-files-found: ignore
          retention-days: 7
