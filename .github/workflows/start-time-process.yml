name: Start-time research process
on:
  pull_request:
    paths:
      - "src/lib/race-collector/**"
      - "scripts/verify-start-time-process.mjs"
      - "scripts/verify-race-collector.mjs"
      - "docs/fixture-geography/start-time-process.md"
      - ".github/workflows/start-time-process.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-start-time-process.mjs
      - run: npm run verify:race-collector
      - run: npm run typecheck
