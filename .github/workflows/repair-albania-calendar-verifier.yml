name: One-shot Albania calendar verifier repair

on:
  push:
    branches:
      - fix/runrecs-gap-fill-types
    paths:
      - .github/workflows/repair-albania-calendar-verifier.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/runrecs-gap-fill-types

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply asserted Albania verifier repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify-albania-running-calendar.mjs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'const CALENDAR_START = "2026-01-01";',
                  'const HISTORICAL_START = "2025-01-01";\nconst CALENDAR_START = "2026-01-01";',
              ),
              (
                  'const expected = [\n  ["berat-green-half-marathon", "2026-04-05", ["10K", "Half"]],',
                  'const expected = [\n  ["durres-marathon", "2025-11-02", ["10K", "5K"]],\n  ["vlora-half-marathon", "2025-11-30", ["10K", "5K", "Half"]],\n  ["berat-green-half-marathon", "2026-04-05", ["10K", "Half"]],',
              ),
              (
                  'assert.equal(albaniaRaceEditions.length, 48, "Unexpected Albania advertised-distance count");',
                  'assert.equal(albaniaRaceEditions.length, 53, "Unexpected Albania advertised-distance count");',
              ),
              (
                  '''  assert(
                    edition.date >= CALENDAR_START,
                    `Albania fixture predates the requested full-year calendar: ${editionKey}`,
                  );''',
                  '''  assert(
                    edition.date >= HISTORICAL_START,
                    `Albania fixture predates retained history: ${editionKey}`,
                  );
                  if (edition.date < CALENDAR_START) {
                    assert(
                      retainedHistoricalEditionKeys.has(editionKey),
                      `Unexpected Albania pre-calendar history: ${editionKey}`,
                    );
                  }''',
              ),
              (
                  '''    !albaniaRaceEditions.some((edition) => edition.seriesSlug === monitoredSlug),
                    `Unadvertised future edition was invented for ${monitoredSlug}`,''',
                  '''    !albaniaRaceEditions.some(
                      (edition) =>
                        edition.seriesSlug === monitoredSlug &&
                        edition.date >= CALENDAR_START &&
                        edition.date <= HORIZON,
                    ),
                    `Unadvertised 2026 or 2027 edition was invented for ${monitoredSlug}`,''',
              ),
              (
                  '      calendar_start: CALENDAR_START,',
                  '      historical_start: HISTORICAL_START,\n      calendar_start: CALENDAR_START,',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one Albania verifier anchor; found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          expected_groups_anchor = '''const expectedGroups = new Map(
            expected.map(([slug, date, distances]) => [key(slug, date), distances]),
          );'''
          expected_groups_replacement = '''const retainedHistoricalEditionKeys = new Set(
            expected
              .filter(([, date]) => date < CALENDAR_START)
              .flatMap(([slug, date, distances]) =>
                distances.map((distance) => `${slug}|${date}|${distance}`),
              ),
          );

          const expectedGroups = new Map(
            expected.map(([slug, date, distances]) => [key(slug, date), distances]),
          );'''
          if text.count(expected_groups_anchor) != 1:
              raise SystemExit(
                  f"Expected one expected-groups anchor; found {text.count(expected_groups_anchor)}"
              )
          text = text.replace(expected_groups_anchor, expected_groups_replacement, 1)

          # The history allow-list must be declared before the edition-validation loop.
          declaration = text.index("const retainedHistoricalEditionKeys")
          validation_loop = text.index("const editionKeys = new Set()")
          if declaration > validation_loop:
              block_start = declaration
              block_end = text.index("const expectedGroups", declaration)
              block = text[block_start:block_end]
              text = text[:block_start] + text[block_end:]
              insert_at = text.index("const editionKeys = new Set()")
              text = text[:insert_at] + block + text[insert_at:]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Verify lint
        run: npm run lint

      - name: Verify Albania calendar safeguards
        run: npm run verify:albania-running-calendar

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-albania-calendar-verifier.yml
          git add scripts/verify-albania-running-calendar.mjs
          git commit -m "Allow verified Albania history in calendar safeguards"
          git push origin HEAD:fix/runrecs-gap-fill-types
