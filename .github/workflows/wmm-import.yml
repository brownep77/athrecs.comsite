name: WMM import safeguards

on:
  pull_request:
    paths:
      - "scripts/*wmm*.py"
      - ".github/workflows/wmm-import.yml"
  push:
    branches: [main]
    paths:
      - "scripts/*wmm*.py"
      - ".github/workflows/wmm-import.yml"

permissions:
  contents: read

jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/*wmm*.py
      - run: python scripts/verify-wmm-profiles.py
