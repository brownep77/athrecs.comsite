name: One-shot central-publisher verifier repair

on:
  push:
    branches:
      - feat/athrecs-athletics-only

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/athrecs-athletics-only
          fetch-depth: 0

      - name: Repair the verifier assertions
        run: python scripts/fix-central-publisher-verifiers.py

      - name: Commit repairs when required
        shell: bash
        run: |
          git config user.name "athrecs-ci"
          git config user.email "athrecs-ci@users.noreply.github.com"
          git add scripts/verify-uk-ireland-prominent-races.mjs \
            scripts/verify-uk-home-nation-championships.mjs
          if git diff --cached --quiet; then
            echo "Central publisher verifiers are already current."
            exit 0
          fi
          git commit -m "Verify catalogue batches through central publisher [publisher-verifier-fix]"
          git push origin HEAD:feat/athrecs-athletics-only
