name: Live race actions - Safari and mobile

# These checks exercise the current PUBLIC production site. Branch/component
# regression coverage remains in event-calendar.yml. No production credentials,
# calendar saves, social posts, emails, or database mutations are performed.
on:
  pull_request:
    paths:
      - "scripts/verify-race-actions-mobile.mjs"
      - "scripts/verify-race-actions-safari.mjs"
      - "scripts/verify-race-actions-ios-native.mjs"
      - "scripts/prepare-ios-safari-simulator.mjs"
      - "scripts/select-ios-safari-simulator.mjs"
      - "scripts/prepare-ios-webdriveragent-prebuilt.mjs"
      - ".github/workflows/race-actions-live-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: race-actions-live-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safari:
    name: Safari - macos
    runs-on: macos-15
    timeout-minutes: 15
    env:
      ATHRECS_SAFARI_PLATFORM: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Safari's native WebDriver
        run: sudo /usr/bin/safaridriver --enable
      - name: Test public calendar and sharing in native Safari
        run: node scripts/verify-race-actions-safari.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-actions-safari-macos
          path: artifacts/race-actions-safari-*
          if-no-files-found: warn

  native-ios:
    name: Safari - native iOS ${{ matrix.runtime }} interface
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: "18.5"
            runner: macos-15-intel
            xcode: /Applications/Xcode_16.4.app/Contents/Developer
            device: iPhone 16
            driver: "12.12.4"
          - runtime: "26.5"
            runner: macos-26-intel
            xcode: /Applications/Xcode_26.6.app/Contents/Developer
            device: iPhone 17
            driver: "12.20.0"
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}
      ATHRECS_SAFARI_REQUIRED_RUNTIME_VERSION: ${{ matrix.runtime }}
      ATHRECS_SAFARI_REQUIRED_DEVICE_NAME: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select matching Xcode
        run: sudo /usr/bin/xcode-select --switch "$DEVELOPER_DIR"
      - name: Install pinned native XCTest automation
        timeout-minutes: 8
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm install --global appium@3.8.0 2>&1 | tee artifacts/race-actions-ios-native-appium-install.log
          appium driver install xcuitest@${{ matrix.driver }} 2>&1 | tee artifacts/race-actions-ios-native-driver-install.log
      - name: Prepare the matching official Simulator test runner
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-ios-webdriveragent-prebuilt.mjs
      - name: Select the installed iPhone for Appium-managed startup
        run: node scripts/select-ios-safari-simulator.mjs
      - name: Test calendar and sharing through native iPhone controls
        timeout-minutes: 15
        run: |
          mkdir -p artifacts
          appium --address 127.0.0.1 --port 4723 --log artifacts/race-actions-ios-native-appium.log > artifacts/race-actions-ios-native-server.log 2>&1 &
          ATHRECS_APPIUM_PROCESS=$!
          trap 'kill "$ATHRECS_APPIUM_PROCESS" 2>/dev/null || true' EXIT
          node scripts/verify-race-actions-ios-native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-actions-safari-native-interface-ios-${{ matrix.runtime }}
          path: |
            artifacts/race-actions-safari-ios-setup*
            artifacts/race-actions-ios-native*
          if-no-files-found: warn

  mobile:
    name: Touch layouts - ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the selected test browser
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Identify branded Chrome used for Android emulation
        if: matrix.engine == 'chromium'
        run: google-chrome --version
      - name: Test live pages with touch input and mobile layouts
        env:
          ATHRECS_MOBILE_ENGINE: ${{ matrix.engine }}
        run: node scripts/verify-race-actions-mobile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-actions-mobile-${{ matrix.engine }}
          path: artifacts/race-actions-mobile-*
          if-no-files-found: warn
