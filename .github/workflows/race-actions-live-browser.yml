name: Live race actions - Safari and mobile

# These checks exercise the current PUBLIC production site. Branch/component
# regression coverage remains in event-calendar.yml. No production credentials,
# calendar saves, social posts, emails, or database mutations are performed.
on:
  pull_request:
    paths:
      - "scripts/verify-race-actions-mobile.mjs"
      - "scripts/verify-race-actions-safari.mjs"
      - "scripts/verify-race-actions-ios-native.mjs"
      - "scripts/prepare-ios-safari-simulator.mjs"
      - ".github/workflows/race-actions-live-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: race-actions-live-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safari:
    name: Safari - ${{ matrix.profile }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: macos
            platform: macos
            runner: macos-15
          - profile: ios-18.5
            platform: ios
            runner: macos-15
            xcode: /Applications/Xcode_16.4.app/Contents/Developer
            runtime: "18.5"
            device: iPhone 16
          - profile: ios-26.5
            platform: ios
            runner: macos-26-intel
            xcode: /Applications/Xcode_26.6.app/Contents/Developer
            runtime: "26.5"
            device: iPhone 17
    env:
      ATHRECS_SAFARI_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select Xcode matching the installed iOS Simulator
        if: matrix.platform == 'ios'
        run: sudo /usr/bin/xcode-select --switch "${{ matrix.xcode }}"
      - name: Enable Safari's native WebDriver
        run: sudo /usr/bin/safaridriver --enable
      - name: Boot an installed iPhone Simulator
        if: matrix.platform == 'ios'
        env:
          ATHRECS_SAFARI_REQUIRED_RUNTIME_VERSION: ${{ matrix.runtime }}
          ATHRECS_SAFARI_REQUIRED_DEVICE_NAME: ${{ matrix.device }}
        run: node scripts/prepare-ios-safari-simulator.mjs
      - name: Test public calendar and sharing in native Safari
        run: node scripts/verify-race-actions-safari.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-actions-safari-${{ matrix.profile }}
          path: artifacts/race-actions-safari-*
          if-no-files-found: warn

  native-ios:
    name: Safari - native iOS ${{ matrix.runtime }} interface
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: "18.5"
            runner: macos-15-intel
            xcode: /Applications/Xcode_16.4.app/Contents/Developer
            device: iPhone 16
            driver: "12.12.4"
          - runtime: "26.5"
            runner: macos-26-intel
            xcode: /Applications/Xcode_26.6.app/Contents/Developer
            device: iPhone 17
            driver: "12.20.0"
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}
      ATHRECS_WDA_DERIVED_DATA_PATH: ${{ runner.temp }}/athrecs-wda
      ATHRECS_SAFARI_REQUIRED_RUNTIME_VERSION: ${{ matrix.runtime }}
      ATHRECS_SAFARI_REQUIRED_DEVICE_NAME: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select matching Xcode
        run: sudo /usr/bin/xcode-select --switch "$DEVELOPER_DIR"
      - name: Install pinned native XCTest automation
        timeout-minutes: 8
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm install --global appium@3.8.0 2>&1 | tee artifacts/race-actions-ios-native-appium-install.log
          appium driver install xcuitest@${{ matrix.driver }} 2>&1 | tee artifacts/race-actions-ios-native-driver-install.log
      - name: Build the native test runner before booting Simulator
        timeout-minutes: 6
        run: |
          set -o pipefail
          ATHRECS_WDA_SOURCE=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createRequire } from 'node:module';
          import { homedir } from 'node:os';
          import path from 'node:path';
          const appiumRoot = process.env.APPIUM_HOME || path.join(homedir(), '.appium');
          const rootRequire = createRequire(path.join(appiumRoot, 'package.json'));
          const driverManifest = rootRequire.resolve('appium-xcuitest-driver/package.json');
          const driverRequire = createRequire(driverManifest);
          const wdaManifest = driverRequire.resolve('appium-webdriveragent/package.json');
          fs.writeFileSync('artifacts/race-actions-ios-native-build-versions.json', JSON.stringify({
            architecture: process.arch,
            driver: rootRequire(driverManifest).version,
            webdriverAgent: driverRequire(wdaManifest).version,
          }, null, 2) + '\n');
          console.log(path.dirname(wdaManifest));
          NODE
          )
          xcodebuild clean build-for-testing \
            -project "$ATHRECS_WDA_SOURCE/WebDriverAgent.xcodeproj" \
            -derivedDataPath "$ATHRECS_WDA_DERIVED_DATA_PATH" \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS Simulator' \
            -jobs 2 CODE_SIGNING_ALLOWED=NO ARCHS=x86_64 \
            2>&1 | tee artifacts/race-actions-ios-native-wda-build.log
      - name: Prepare the installed iPhone and Safari
        run: node scripts/prepare-ios-safari-simulator.mjs
      - name: Test calendar and sharing through native iPhone controls
        timeout-minutes: 9
        run: |
          mkdir -p artifacts
          appium --address 127.0.0.1 --port 4723 --log artifacts/race-actions-ios-native-appium.log > artifacts/race-actions-ios-native-server.log 2>&1 &
          ATHRECS_APPIUM_PROCESS=$!
          trap 'kill "$ATHRECS_APPIUM_PROCESS" 2>/dev/null || true' EXIT
          node scripts/verify-race-actions-ios-native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-actions-safari-native-interface-ios-${{ matrix.runtime }}
          path: |
            artifacts/race-actions-safari-ios-setup*
            artifacts/race-actions-ios-native*
          if-no-files-found: warn

  mobile:
    name: Touch layouts - ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the selected test browser
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Identify branded Chrome used for Android emulation
        if: matrix.engine == 'chromium'
        run: google-chrome --version
      - name: Test live pages with touch input and mobile layouts
        env:
          ATHRECS_MOBILE_ENGINE: ${{ matrix.engine }}
        run: node scripts/verify-race-actions-mobile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-actions-mobile-${{ matrix.engine }}
          path: artifacts/race-actions-mobile-*
          if-no-files-found: warn
