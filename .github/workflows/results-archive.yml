name: Central results archive
on:
  pull_request:
    paths: &archive-paths
      - "src/lib/results-archive/**"
      - "src/lib/athlete-finder/**"
      - "src/components/staff/AthleteResultFinder.tsx"
      - "src/components/staff/AthleteSourceCheck.tsx"
      - "src/components/staff/AthleteSourceCoverage.tsx"
      - "src/routes/admin/athlete-result-finder.tsx"
      - "scripts/verify-athlete-source-*.mjs"
      - "scripts/backfill-athlete-finder-capture-index.mjs"
      - "scripts/verify-athlete-finder-capture-backfill.mjs"
      - "src/components/staff/*Archive*"
      - "src/components/athletes/*Result*"
      - "src/lib/athrecs/seed.server.ts"
      - "src/lib/athrecs/results-import.server.ts"
      - "migrations/**"
      - "scripts/verify-results-archive*"
      - "scripts/verify-browser-results-button.mjs"
      - "scripts/lib/browser-results-button.mjs"
      - "scripts/build-browser-results-button.mjs"
      - "public/tools/browser-results.html"
      - "public/tools/import-results.*"
      - "scripts/lib/browser-results-receiver.ts"
      - "scripts/lib/london-page-collection.mjs"
      - "scripts/fixtures/london-pagination.mjs"
      - "src/routes/admin/result-archive.tsx"
      - "scripts/verify-captured-results.mjs"
      - "scripts/verify-private-archive-profiles.py"
      - "src/components/staff/CapturedResultsBrowser.tsx"
      - ".github/workflows/results-archive.yml"
  push:
    branches: [main]
    paths: *archive-paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: athrecs_archive_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d athrecs_archive_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Captured result pagination and private profile screening
        run: |
          npm run verify:captured-results
          npm run verify:private-archive-profiles
      - name: Real PostgreSQL transactions and concurrent imports
        run: npm run verify:results-archive
        env:
          ATHRECS_ARCHIVE_TEST_POSTGRES: "1"
      - name: Athlete finder, source coverage and supported URL checks
        run: |
          npm run verify:athlete-source-finder
          npm run verify:athlete-source-coverage
          npm run verify:athlete-finder-capture-backfill
          npm run verify:athlete-source-check
      - run: npx playwright install --with-deps chromium
      - name: Browser bookmark capture and London list regression
        run: node scripts/verify-browser-results-button.mjs
      - name: Browser to API to disposable database
        run: npm run verify:results-archive-browser
      - name: Athlete finder browser to API to disposable database
        run: npm run verify:athlete-source-finder-browser
