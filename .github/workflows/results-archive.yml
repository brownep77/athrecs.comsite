name: Central results archive
on:
  pull_request:
    paths:
      - "src/lib/results-archive/**"
      - "src/components/staff/*Archive*"
      - "src/components/athletes/*Result*"
      - "src/lib/athrecs/seed.server.ts"
      - "migrations/**"
      - "scripts/verify-results-archive*"
      - "scripts/verify-captured-results.mjs"
      - "scripts/verify-private-archive-profiles.py"
      - "src/components/staff/CapturedResultsBrowser.tsx"
      - ".github/workflows/results-archive.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: athrecs_archive_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d athrecs_archive_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Captured result pagination and private profile screening
        run: |
          npm run verify:captured-results
          npm run verify:private-archive-profiles
      - name: Real PostgreSQL transactions and concurrent imports
        run: npm run verify:results-archive
        env:
          ATHRECS_ARCHIVE_TEST_POSTGRES: "1"
      - run: npx playwright install --with-deps chromium
      - name: Browser to API to disposable database
        run: npm run verify:results-archive-browser
