name: Verify manual athlete publication

on:
  pull_request:
    paths:
      - 'migrations/20260923_publish_david_torrens.sql'
      - 'scripts/verify-manual-athlete-publication.mjs'
      - '.github/workflows/verify-manual-athlete-publication.yml'
  push:
    branches:
      - 'fix/publish-david-torrens-20260923'
    paths:
      - 'migrations/20260923_publish_david_torrens.sql'
      - 'scripts/verify-manual-athlete-publication.mjs'
      - '.github/workflows/verify-manual-athlete-publication.yml'
  workflow_dispatch:
    inputs:
      profile_path:
        description: 'Public athlete profile path to verify, without query parameters'
        required: true
        default: '/athletes/david-torrens'
        type: string

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/verify-manual-athlete-publication.mjs

  public-profile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read the public profile without credentials
        env:
          PROFILE_PATH: ${{ inputs.profile_path }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const path = process.env.PROFILE_PATH;
          assert(/^\/athletes\/[a-z0-9-]+$/.test(path), 'Expected a public athlete path');
          const url = `https://www.athrecs.com${path}`;
          const response = await fetch(url, {signal: AbortSignal.timeout(60000)});
          const html = await response.text();
          const heading = [...html.matchAll(/<h1\b[^>]*>([\s\S]*?)<\/h1>/gi)].map(m => m[1].replace(/<[^>]*>/g, '').trim()).join(' | ');
          console.log(`Public URL: ${response.url}`);
          console.log(`HTTP status: ${response.status}`);
          console.log(`Heading: ${heading}`);
          assert.equal(response.status, 200, 'Public profile must return HTTP 200');
          assert(/David Torrens/i.test(heading), 'Profile must identify David Torrens');
          assert(/St Albans/i.test(html), 'Profile must include St Albans');
          assert(/1:03:34/.test(html), 'Profile must render the approved time');
          assert(/10K/i.test(html), 'Profile must include the 10K distance');
          console.log('PASS: public David Torrens profile and approved St Albans 10K time are visible.');
          NODE
