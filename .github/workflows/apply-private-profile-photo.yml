name: Apply private Athlete Profile photo feature

on:
  push:
    branches:
      - codex/private-athlete-profile-photo
    paths:
      - .github/workflows/apply-private-profile-photo.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athrecs_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athrecs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/athrecs_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/private-athlete-profile-photo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply profile photo integration
        run: node scripts/apply-private-profile-photo.mjs
      - name: Install private Blob SDK
        run: npm install @vercel/blob@latest --save --no-audit --no-fund
      - name: Generate the TanStack route tree
        run: npx vite build --mode development
      - name: Run complete quality gate
        run: npm run ci:verify
      - name: Remove one-off integration helpers
        run: |
          rm scripts/apply-private-profile-photo.mjs
          rm .github/workflows/apply-private-profile-photo.yml
      - name: Commit verified feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No profile photo changes to commit"
          else
            git commit -m "Add private Athlete Profile photo upload"
            git push origin HEAD:codex/private-athlete-profile-photo
          fi
