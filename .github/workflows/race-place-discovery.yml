name: Race location discovery
on:
  pull_request:
    paths:
      - "src/lib/athrecs/race-place*"
      - "src/components/races/RacePlacesPage.tsx"
      - "src/routes/races/places/**"
      - "scripts/verify-race-places*"
      - ".github/workflows/race-place-discovery.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: race-place-discovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify-race-places.mjs --catalogue
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      # Build only. No migration, source scan, email, or production publication.
      - run: npx vite build
      - run: node scripts/verify-race-places-ssr.mjs --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-place-discovery-evidence
          path: artifacts/
          if-no-files-found: warn
