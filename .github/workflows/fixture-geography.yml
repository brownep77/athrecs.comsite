name: Fixture geography and imports

on:
  pull_request:
    paths:
      - "src/components/discovery/CompactDiscoveryPage.tsx"
      - "src/lib/athrecs/import.server.ts"
      - "src/lib/athrecs/fixture-presentation.ts"
      - "src/lib/athrecs/sport-fixtures.server.ts"
      - "src/data/fixture-county-regions*"
      - "migrations/20261026_fixture_county_regions.sql"
      - "docs/fixture-geography/county-region*"
      - "scripts/verify-fixture-county-regions.mjs"
      - "scripts/verify-import-geography.mjs"
      - "scripts/verify-fixture-geography-ui.mjs"
      - ".github/workflows/fixture-geography.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/athrecs_geography_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athrecs_geography_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athrecs_geography_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify-import-geography.mjs
      - run: node scripts/verify-fixture-county-regions.mjs
      - run: node scripts/verify-sport-fixture-pages.mjs
      - run: node scripts/verify-fixture-presentation.mjs
      - run: npx playwright install --with-deps chromium
      - name: Start disposable seeded site
        run: |
          node scripts/migrate.mjs
          mkdir -p artifacts
          nohup npm run dev -- --force > artifacts/preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8080/favicon.png > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat artifacts/preview.log
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --show-error --max-time 180 http://127.0.0.1:8080/sportsrecs > artifacts/sportsrecs-warm.html
      - run: node scripts/verify-fixture-geography-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-geography
          path: artifacts/
