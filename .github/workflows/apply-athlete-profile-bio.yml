name: Apply automatic Athlete Profile bio

on:
  push:
    branches:
      - codex/automatic-athlete-profile-bio
    paths:
      - .github/workflows/apply-athlete-profile-bio.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athrecs_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athrecs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/athrecs_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/automatic-athlete-profile-bio
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Register bio card and verification
        run: node scripts/apply-athlete-bio-profile.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete quality gate
        run: npm run ci:verify
      - name: Remove one-off integration helpers
        run: git rm -- scripts/apply-athlete-bio-profile.mjs .github/workflows/apply-athlete-profile-bio.yml
      - name: Commit verified bio feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json src/routes/my-athlete-profile.tsx
          if git diff --cached --quiet; then
            echo "No final integration changes"
          else
            git commit -m "Add optional automatic Athlete Profile bios"
            git push origin HEAD:codex/automatic-athlete-profile-bio
          fi
