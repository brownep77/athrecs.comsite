name: Staff results upload check
on:
  pull_request:
    paths:
      - 'src/lib/staff-results-upload/**'
      - 'src/routes/admin/check-results-upload.tsx'
      - 'src/components/staff/StaffMicrositeShell.tsx'
      - 'scripts/verify-staff-results-*.mjs'
      - '.github/workflows/staff-results-upload.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staff-results-upload-${{ github.ref }}
  cancel-in-progress: true
jobs:
  upload-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ''
      VITE_SITE_BRAND: athrecs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Synthetic CSV, Excel, source and read-only review tests
        run: node scripts/verify-staff-results-upload.mjs
      - name: Migrated-schema synthetic imports, rollback and repeat safety
        run: node scripts/verify-staff-results-commit.mjs
      - name: Generate routes and build without migration or publication hooks
        run: npx vite build --mode development
      - run: npm run typecheck
      - name: Lint changed code
        run: npx eslint src/lib/staff-results-upload/ src/routes/admin/check-results-upload.tsx scripts/verify-staff-results-upload.mjs scripts/verify-staff-results-commit.mjs scripts/verify-staff-results-browser.mjs
      - name: Install isolated browser-test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile import-flow interaction tests
        run: node scripts/verify-staff-results-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staff-import-browser-checks
          path: |
            artifacts/import-desktop.png
            artifacts/import-mobile.png
          if-no-files-found: ignore
          retention-days: 7
