name: Apply claim form cache hotfix

on:
  push:
    branches:
      - codex/claim-form-cache-hotfix

permissions:
  contents: write

concurrency:
  group: claim-form-cache-hotfix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/athrecs_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athrecs_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athrecs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/claim-form-cache-hotfix
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply claim form hotfix
        run: node scripts/apply-claim-form-cache-hotfix.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete quality gate
        run: npm run ci:verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -- \
            .github/workflows/apply-claim-form-cache-hotfix.yml \
            scripts/apply-claim-form-cache-hotfix.mjs

          git add -- \
            scripts/verify-result-claims.mjs \
            src/routes/claim-results.tsx \
            vercel.json

          git diff --cached --check
          git commit -m "Remove stale verification-detail claim flow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
