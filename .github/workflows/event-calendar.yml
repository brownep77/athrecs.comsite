name: Event calendar export
on:
  pull_request:
    paths:
      - 'src/lib/athrecs/*calendar*'
      - 'src/lib/athrecs/timezone.ts'
      - 'src/components/races/**'
      - 'src/components/running/Road*Pages.tsx'
      - 'src/routes/races/$slug.tsx'
      - 'scripts/verify-event-calendar*'
      - '.github/workflows/event-calendar.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: event-calendar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify-event-calendar.mjs --mutations
      - run: node scripts/verify-event-calendar-catalogue.mjs
      - name: Independently parse exported calendar files
        run: |
          npm install --prefix "$RUNNER_TEMP/calendar-interop" --ignore-scripts --no-audit --no-fund ical.js@2.2.1
          CALENDAR_ICAL_MODULE="$RUNNER_TEMP/calendar-interop/node_modules/ical.js/dist/ical.js" node scripts/verify-event-calendar-interop.mjs
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-event-calendar-browser.mjs
      # Compilation only: do not migrate, seed, email or publish production data.
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-calendar-browser-evidence
          path: artifacts/calendar-*.png
          if-no-files-found: warn
