name: Event calendar export
on:
  pull_request:
    paths:
      - "src/lib/athrecs/*calendar*"
      - "src/lib/athrecs/race-sharing.ts"
      - "src/lib/athrecs/timezone.ts"
      - "src/lib/athrecs/distance.ts"
      - "src/data/fixture-details.ts"
      - "src/lib/running/catalogue.server.ts"
      - "scripts/verify-fixture-start-clarity.mjs"
      - "src/data/accra-start-2026-10-25.json"
      - "scripts/lib/accra-start-2026-10-25-review.mjs"
      - "scripts/verify-accra-start.mjs"
      - "src/components/races/**"
      - "src/components/discovery/CompactFixtureRow.tsx"
      - "src/components/running/Road*Pages.tsx"
      - "src/components/analytics/SiteAnalytics.tsx"
      - "src/components/layout/AppShell.tsx"
      - "src/router.tsx"
      - "src/routes/races/$slug.tsx"
      - "src/routes/api/event-calendar.ts"
      - "src/routes/api/race-calendar/**"
      - "src/routes/my-race-calendar.tsx"
      - "migrations/*race_calendar*"
      - "scripts/verify-event-calendar*"
      - "scripts/verify-race-sharing.mjs"
      - ".github/workflows/event-calendar.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: event-calendar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify-fixture-start-clarity.mjs
      - run: node scripts/verify-accra-start.mjs
      - run: node scripts/verify-race-sharing.mjs
      - run: node scripts/verify-event-calendar.mjs --mutations
      - run: node scripts/verify-event-calendar-catalogue.mjs
      - run: node scripts/verify-event-calendar-download.mjs
      - run: node scripts/verify-event-calendar-subscription.mjs
      - name: Independently parse exported calendar files
        run: |
          npm install --prefix "$RUNNER_TEMP/calendar-interop" --ignore-scripts --no-audit --no-fund ical.js@2.2.1
          CALENDAR_ICAL_MODULE="$RUNNER_TEMP/calendar-interop/node_modules/ical.js/dist/ical.js" node scripts/verify-event-calendar-interop.mjs
      - run: npx tsc --noEmit
      - run: node scripts/verify-hamburg-race-example.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Check calendar and sharing in Chromium, Firefox and WebKit
        run: |
          set -e
          for browser in chromium firefox webkit; do
            ATHRECS_BROWSER_ENGINE="$browser" node scripts/verify-event-calendar-browser.mjs
          done
      # Compilation only: do not migrate, seed, email or publish production data.
      - run: npx vite build
      - run: node scripts/copy-pglite-assets.mjs
      - name: Keep loading-time gestures and Back navigation stable in all browsers
        timeout-minutes: 5
        run: node scripts/verify-event-calendar-hydration.mjs
      - run: node scripts/verify-event-calendar-built.mjs
      - run: node scripts/verify-event-calendar-subscription-built.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-calendar-browser-evidence
          path: |
            artifacts/calendar-*.png
            artifacts/calendar-hydration-*.json
          if-no-files-found: warn
