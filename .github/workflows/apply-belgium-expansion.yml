              '  ...(franceSpainPortugalRaceSeries as Series[]),\n'
              '  ...(belgiumNetherlandsRaceSeries as Series[]),'
          )
          new_series_anchor = (
              '  ...(franceSpainPortugalRaceSeries as Series[]),\n'
              '  ...(belgiumComprehensiveRaceSeries as Series[]),\n'
              '  ...(belgiumNetherlandsRaceSeries as Series[]),'
          )
          if new_series_anchor not in catalogue:
              if old_series_anchor not in catalogue:
                  raise SystemExit("Belgium series insertion anchor not found")
              catalogue = catalogue.replace(old_series_anchor, new_series_anchor, 1)

          old_edition_block = (
              '  ...(belgiumNetherlandsRaceEditions as Edition[]).filter((edition) =>\n'
              '    usedSlugs.has(edition.seriesSlug),\n'
              '  ),'
          )
          new_edition_block = (
              '  ...(belgiumComprehensiveRaceEditions as Edition[]).filter((edition) =>\n'
              '    usedSlugs.has(edition.seriesSlug),\n'
              '  ),\n'
              '  ...(belgiumNetherlandsRaceEditions as Edition[]).filter(\n'
              '    (edition) =>\n'
              '      usedSlugs.has(edition.seriesSlug) &&\n'
              '      !belgiumComprehensiveReplacementSlugs.has(edition.seriesSlug),\n'
              '  ),'
          )
          if new_edition_block not in catalogue:
              if old_edition_block not in catalogue:
                  raise SystemExit("Belgium edition insertion anchor not found")
              catalogue = catalogue.replace(old_edition_block, new_edition_block, 1)

          catalogue_path.write_text(catalogue, encoding="utf-8")

          seed_path = Path("src/lib/athrecs/seed.server.ts")
          seed = seed_path.read_text(encoding="utf-8")
          if 'athrecs-belgium-comprehensive-calendar-v270' not in seed:
              old_seed = 'athrecs-belgium-netherlands-running-calendar-v269'
              if old_seed not in seed:
                  raise SystemExit("Expected v269 seed marker not found")
              seed = seed.replace(old_seed, 'athrecs-belgium-comprehensive-calendar-v270', 1)
              seed_path.write_text(seed, encoding="utf-8")

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          scripts = package.setdefault("scripts", {})
          scripts["verify:belgium-comprehensive"] = (
              "node scripts/verify-belgium-comprehensive-calendar.mjs"
          )
          ci_verify = scripts.get("ci:verify", "")
          if "verify:belgium-comprehensive" not in ci_verify:
              scripts["ci:verify"] = (
                  ci_verify + " && npm run verify:belgium-comprehensive"
                  if ci_verify
                  else "npm run verify:belgium-comprehensive"
              )
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          old_audit_path = Path("docs/belgium-netherlands-calendar-audit.md")
          old_audit = old_audit_path.read_text(encoding="utf-8")
          notice = (
              "> **Belgium coverage in this document has been superseded by "
              "[the comprehensive Belgium audit](./belgium-calendar-comprehensive-audit.md). "
              "The Netherlands section remains applicable.**\n\n"
          )
          if not old_audit.startswith("> **Belgium coverage"):
              old_audit_path.write_text(notice + old_audit, encoding="utf-8")

          workflow_path = Path(".github/workflows/apply-belgium-expansion.yml")
          workflow_path.unlink()
          PY

      - name: Commit generated Belgium calendar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/belgium-races-comprehensive.ts \
            src/data/catalogue.ts \
            src/lib/athrecs/seed.server.ts \
            scripts/verify-belgium-comprehensive-calendar.mjs \
            docs/belgium-calendar-comprehensive-audit.md \
            docs/belgium-netherlands-calendar-audit.md \
            package.json \
            .github/workflows/apply-belgium-expansion.yml
          git commit -m "data: expand Belgium to comprehensive national calendar"
          git push origin HEAD:data/comprehensive-belgium-calendar-2026
