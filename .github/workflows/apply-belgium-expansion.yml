name: Apply comprehensive Belgium calendar expansion

on:
  push:
    branches:
      - data/comprehensive-belgium-calendar-2026
    paths:
      - .github/workflows/apply-belgium-expansion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/comprehensive-belgium-calendar-2026
          fetch-depth: 0

      - name: Verify payload and apply audited Belgium calendar
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import shutil
          import tarfile
          from pathlib import Path

          payload_dir = Path(".github/belgium-payload")
          chunk_paths = sorted(payload_dir.glob("chunk-*.txt"))
          if [path.name for path in chunk_paths] != [f"chunk-{index:02d}.txt" for index in range(10)]:
              raise SystemExit(f"Expected ten ordered payload chunks, got {[path.name for path in chunk_paths]}")

          encoded = "".join(path.read_text(encoding="utf-8").strip() for path in chunk_paths)
          if len(encoded) != 19396:
              raise SystemExit(f"Belgium payload length mismatch: {len(encoded)}")
          encoded_sha = hashlib.sha256(encoded.encode("ascii")).hexdigest()
          if encoded_sha != "b5f37e9aaae18e89c3568f174737f5c9e373f5ab8cd927b5d7d4f270547cc4da":
              raise SystemExit(f"Belgium encoded payload checksum mismatch: {encoded_sha}")

          payload = base64.b64decode(encoded, validate=True)
          payload_sha = hashlib.sha256(payload).hexdigest()
          if payload_sha != "89dbff4ca04e7c8465acb35f3b77a7e5b411029d565eb33b835506b9e64d4e89":
              raise SystemExit(f"Belgium archive checksum mismatch: {payload_sha}")

          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              archive.extractall(".")

          catalogue_path = Path("src/data/catalogue.ts")
          catalogue = catalogue_path.read_text(encoding="utf-8")

          old_import = (
              'import {\n'
              '  belgiumNetherlandsRaceEditions,\n'
              '  belgiumNetherlandsRaceSeries,\n'
              '} from "./belgium-netherlands-races";\n'
          )
          new_import = (
              'import {\n'
              '  belgiumComprehensiveRaceEditions,\n'
              '  belgiumComprehensiveRaceSeries,\n'
              '  belgiumComprehensiveReplacementSlugs,\n'
              '} from "./belgium-races-comprehensive";\n'
          )
          if new_import not in catalogue:
              if old_import not in catalogue:
                  raise SystemExit("Belgium catalogue import anchor not found")
              catalogue = catalogue.replace(old_import, old_import + new_import, 1)

          old_series_anchor = (
              '  ...(franceSpainPortugalRaceSeries as Series[]),\n'
              '  ...(belgiumNetherlandsRaceSeries as Series[]),'
          )
          new_series_anchor = (
              '  ...(franceSpainPortugalRaceSeries as Series[]),\n'
              '  ...(belgiumComprehensiveRaceSeries as Series[]),\n'
              '  ...(belgiumNetherlandsRaceSeries as Series[]),'
          )
          if new_series_anchor not in catalogue:
              if old_series_anchor not in catalogue:
                  raise SystemExit("Belgium series insertion anchor not found")
              catalogue = catalogue.replace(old_series_anchor, new_series_anchor, 1)

          old_edition_block = (
              '  ...(belgiumNetherlandsRaceEditions as Edition[]).filter((edition) =>\n'
              '    usedSlugs.has(edition.seriesSlug),\n'
              '  ),'
          )
          new_edition_block = (
              '  ...(belgiumComprehensiveRaceEditions as Edition[]).filter((edition) =>\n'
              '    usedSlugs.has(edition.seriesSlug),\n'
              '  ),\n'
              '  ...(belgiumNetherlandsRaceEditions as Edition[]).filter(\n'
              '    (edition) =>\n'
              '      usedSlugs.has(edition.seriesSlug) &&\n'
              '      !belgiumComprehensiveReplacementSlugs.has(edition.seriesSlug),\n'
              '  ),'
          )
          if new_edition_block not in catalogue:
              if old_edition_block not in catalogue:
                  raise SystemExit("Belgium edition insertion anchor not found")
              catalogue = catalogue.replace(old_edition_block, new_edition_block, 1)

          catalogue_path.write_text(catalogue, encoding="utf-8")

          seed_path = Path("src/lib/athrecs/seed.server.ts")
          seed = seed_path.read_text(encoding="utf-8")
          if 'athrecs-belgium-comprehensive-calendar-v270' not in seed:
              old_seed = 'athrecs-belgium-netherlands-running-calendar-v269'
              if old_seed not in seed:
                  raise SystemExit("Expected v269 seed marker not found")
              seed = seed.replace(old_seed, 'athrecs-belgium-comprehensive-calendar-v270', 1)
              seed_path.write_text(seed, encoding="utf-8")

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          scripts = package.setdefault("scripts", {})
          scripts["verify:belgium-comprehensive"] = (
              "node scripts/verify-belgium-comprehensive-calendar.mjs"
          )
          ci_verify = scripts.get("ci:verify", "")
          if "verify:belgium-comprehensive" not in ci_verify:
              scripts["ci:verify"] = (
                  ci_verify + " && npm run verify:belgium-comprehensive"
                  if ci_verify
                  else "npm run verify:belgium-comprehensive"
              )
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          old_audit_path = Path("docs/belgium-netherlands-calendar-audit.md")
          old_audit = old_audit_path.read_text(encoding="utf-8")
          notice = (
              "> **Belgium coverage in this document has been superseded by "
              "[the comprehensive Belgium audit](./belgium-calendar-comprehensive-audit.md). "
              "The Netherlands section remains applicable.**\n\n"
          )
          if not old_audit.startswith("> **Belgium coverage"):
              old_audit_path.write_text(notice + old_audit, encoding="utf-8")

          shutil.rmtree(payload_dir)
          workflow_path = Path(".github/workflows/apply-belgium-expansion.yml")
          workflow_path.unlink()
          PY

      - name: Commit generated Belgium calendar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: expand Belgium to comprehensive national calendar"
          git push origin HEAD:data/comprehensive-belgium-calendar-2026
