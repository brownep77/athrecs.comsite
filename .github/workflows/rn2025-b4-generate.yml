name: Run Norwich batch 4 verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: npm ci --ignore-scripts
      - name: Verify catalogue and batch 4
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createServer } from 'vite';
          const vite=await createServer({server:{middlewareMode:true},appType:'custom',logLevel:'error'});
          const m=await vite.ssrLoadModule('/src/data/catalogue.ts');
          assert.equal(m.athletes.length,563);
          assert.equal(m.results.length,1835);
          assert.equal(new Set(m.athletes.map(a=>a.slug)).size,m.athletes.length,'duplicate athlete slugs');
          const slugs=new Set(m.athletes.map(a=>a.slug));
          for(const r of m.results) assert(slugs.has(r.athleteSlug),`missing athlete ${r.athleteSlug}`);
          const batch=m.results.filter(r=>r.eventSlug==='run-norwich'&&r.date==='2025-09-07'&&r.distance==='10K'&&r.place>=301&&r.place<=400);
          assert.equal(batch.length,100);
          assert.deepEqual(batch.map(r=>r.place).sort((a,b)=>a-b),Array.from({length:100},(_,i)=>301+i));
          const b4=await vite.ssrLoadModule('/src/data/athletes-rn2025-b4.ts');
          assert.equal(b4.athletesRn2025B4.length,98);
          assert(b4.athletesRn2025B4.every(a=>!/placeholder/i.test(a.bio)));
          assert(slugs.has('simon-wright')&&slugs.has('perry-payne')&&slugs.has('mark-robinson-511'));
          const mark=batch.find(r=>r.place===376); assert.equal(mark.athleteSlug,'mark-robinson-511');
          console.log(JSON.stringify({athletes:m.athletes.length,results:m.results.length,batch4Athletes:b4.athletesRn2025B4.length,batch4Results:batch.length,places:'301-400 complete'},null,2));
          await vite.close();
          NODE
      - name: Build
        run: npm run build
      - name: Bump seed version after verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/athrecs/seed.server.ts')
          text=p.read_text()
          old='const SEED_VERSION = "athrecs-rn2025-batch3-v32";'
          new='const SEED_VERSION = "athrecs-rn2025-batch4-v33";'
          if new not in text:
              if old not in text: raise SystemExit('Expected seed version not found')
              text=text.replace(old,new,1)
              p.write_text(text)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- src/lib/athrecs/seed.server.ts; then
            git add src/lib/athrecs/seed.server.ts
            git commit -m 'Bump seed version for Run Norwich batch 4'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
