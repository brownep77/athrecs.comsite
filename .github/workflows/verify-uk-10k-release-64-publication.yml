name: Verify UK 10K release 64 publication

on:
  pull_request:
    paths:
      - "src/data/uk-10k-release-64.ts"
      - "src/data/entry-options.ts"
      - "scripts/publish-uk-10k-release-64.mjs"
      - "scripts/verify-uk-10k-release-64-publication.mjs"
      - ".github/workflows/verify-uk-10k-release-64-publication.yml"
      - "vercel.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athrecs_uk_10k_release_64_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athrecs_uk_10k_release_64_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/athrecs_uk_10k_release_64_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Publish twice and verify catalogue state
        run: node --experimental-strip-types scripts/verify-uk-10k-release-64-publication.mjs
