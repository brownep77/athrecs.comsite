name: Verify remaining race-addition publication

on:
  pull_request:
    paths:
      - "src/data/non-standard-races-uk-ireland.ts"
      - "src/data/half-ten-mile-races-uk-ireland-daily-followup.ts"
      - "src/data/entry-options-uk-10ks.ts"
      - "src/data/catalogue.ts"
      - "src/data/entry-options.ts"
      - "scripts/publish-remaining-uk-ireland-race-additions.mjs"
      - "scripts/verify-remaining-race-additions-publication.mjs"
      - ".github/workflows/verify-remaining-race-additions-publication.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athrecs_remaining_races_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athrecs_remaining_races_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/athrecs_remaining_races_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Execute both publication batches twice and verify database state
        run: node --experimental-strip-types scripts/verify-remaining-race-additions-publication.mjs
