name: Generate catalogue automation route tree

on:
  push:
    branches:
      - codex/automated-catalogue-staging
    paths:
      - .github/workflows/generate-catalogue-automation-route.yml
      - src/routes/api/catalogue-automation.ts

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/automated-catalogue-staging
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate and verify route tree
        run: |
          npx vite build
          grep -F "/api/catalogue-automation" src/routeTree.gen.ts

      - name: Commit generated route tree
        run: |
          git config user.name "Athrecs Safety Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git commit -m "Register catalogue automation route"
            git push origin HEAD:codex/automated-catalogue-staging
          fi
