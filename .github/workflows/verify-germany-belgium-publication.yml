name: Verify Germany and Belgium catalogue publication

on:
  pull_request:
    paths:
      - "src/data/germany-endurance-races.ts"
      - "src/data/belgium-elite-youth-competition-*.ts"
      - "src/data/belgium-elite-youth-competitions.ts"
      - "src/data/verified-all-sport.ts"
      - "src/data/catalogue.ts"
      - "src/lib/athrecs/import.server.ts"
      - "src/lib/athrecs/catalogue-publishing.server.ts"
      - "scripts/publish-germany-belgium-catalogues.mjs"
      - "scripts/verify-germany-belgium-publication.mjs"
      - ".github/workflows/verify-germany-belgium-publication.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athrecs_germany_belgium_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athrecs_germany_belgium_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/athrecs_germany_belgium_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Execute all three catalogue batches twice and verify database state
        run: node --experimental-strip-types scripts/verify-germany-belgium-publication.mjs
