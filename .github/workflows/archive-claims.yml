name: Immediate archive result claims
on:
  pull_request:
    paths:
      - 'src/lib/results-archive/**'
      - 'src/lib/athrecs/result-claim*'
      - 'src/components/athletes/PotentialResultMatchesPanel.tsx'
      - 'src/components/staff/ArchiveClaimRequests.tsx'
      - 'src/routes/admin/result-claims.tsx'
      - 'scripts/verify-archive-claims.mjs'
      - '.github/workflows/archive-claims.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: athrecs_archive_claim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athrecs_archive_claim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ""
      ATHRECS_ARCHIVE_CLAIM_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify-archive-claims.mjs
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify-archive-claims.mjs
      - run: npm run typecheck
      - run: npx eslint src/lib/results-archive/claim.server.ts src/lib/results-archive/member-api.ts src/lib/results-archive/member.server.ts src/components/staff/ArchiveClaimRequests.tsx src/components/athletes/PotentialResultMatchesPanel.tsx src/routes/admin/result-claims.tsx scripts/verify-archive-claims.mjs
