name: Club profiles
on:
  pull_request:
    paths:
      - "src/data/club*"
      - "src/data/catalogue.ts"
      - "src/components/clubs/**"
      - "src/routes/clubs/**"
      - "src/lib/clubs/**"
      - "scripts/*club*"
      - ".github/workflows/club-profiles.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: club-profiles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/verify-club-audit.mjs
      - run: node --experimental-strip-types scripts/verify-club-profiles.mjs
      - run: npx playwright install chromium --with-deps
      - run: node scripts/verify-club-profiles-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: club-profile-browser-evidence
          path: artifacts/club-profile-*
          if-no-files-found: warn
