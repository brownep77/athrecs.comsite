name: One-shot Athletics route type repair

on:
  push:
    branches:
      - feat/athrecs-athletics-only

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/athrecs-athletics-only
          fetch-depth: 0

      - name: Apply reviewed route type repairs
        run: python scripts/fix-athletics-route-types.py

      - name: Commit repairs when required
        shell: bash
        run: |
          git config user.name "athrecs-ci"
          git config user.email "athrecs-ci@users.noreply.github.com"
          git add src/components/races/EventSearch.tsx src/athletics/routes
          if git diff --cached --quiet; then
            echo "Athletics route types are already repaired."
            exit 0
          fi
          git commit -m "Fix Athletics route loader typing [athletics-type-fix]"
          git push origin HEAD:feat/athrecs-athletics-only
