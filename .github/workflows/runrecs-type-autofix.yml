name: One-shot RunRecs type repair

on:
  push:
    branches:
      - feat/runrecs-running-site

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[runrecs-type-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runrecs-running-site
          fetch-depth: 0
      - name: Apply the two reviewed type repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path("src/runrecs/api.ts")
          text = api.read_text()
          replacements = [
              ("    const mapped = rows", "    const mapped: EventListItem[] = rows"),
              ("      .map((rawRow) => {", "      .map((rawRow): EventListItem | null => {"),
              (
                  "        const { groups_json, ...row } = rawRow;",
                  "        const { groups_json, distances_csv, ...row } = rawRow;",
              ),
              (
                  '          row.distances_csv ? row.distances_csv.split(",") : [],',
                  '          distances_csv ? distances_csv.split(",") : [],',
              ),
          ]
          for before, after in replacements:
              if before not in text:
                  raise SystemExit(f"RunRecs API type-repair anchor was not found: {before}")
              text = text.replace(before, after, 1)
          api.write_text(text)

          home = Path("src/runrecs/routes/index.tsx")
          text = home.read_text()
          before = "  const { stats, races, updates } = Route.useLoaderData();"
          after = '''  // The committed ATHRECS route tree still describes the base homepage during
          // standalone type-checking; Vite swaps in this loader for RunRecs builds.
          const { stats, races, updates } = Route.useLoaderData() as unknown as {
            stats: {
              events: number;
              clubs: number;
              athletes: number;
              upcoming: number;
              bySport: Array<{ sport: string; n: number; upcoming: number }>;
            };
            races: EventListItem[];
            updates: HomeSportUpdate[];
          };'''
          if before not in text:
              raise SystemExit("RunRecs homepage type-repair anchor was not found")
          home.write_text(text.replace(before, after, 1))
          PY
      - name: Commit the repair
        shell: bash
        run: |
          git config user.name "athrecs-ci"
          git config user.email "athrecs-ci@users.noreply.github.com"
          git add src/runrecs/api.ts src/runrecs/routes/index.tsx
          git commit -m "Fix RunRecs type inference [runrecs-type-fix]"
          git push origin HEAD:feat/runrecs-running-site
