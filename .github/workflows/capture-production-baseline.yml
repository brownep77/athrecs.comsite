name: Capture Athrecs production baseline

on:
  push:
    branches:
      - codex/athrecs-stability-and-slugs
    paths:
      - .github/workflows/capture-production-baseline.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.repository == 'brownep77/athrecs.comsite' && github.ref == 'refs/heads/codex/athrecs-stability-and-slugs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/athrecs-stability-and-slugs

      - name: Fetch live public homepage
        run: |
          mkdir -p artifacts docs/release-baselines
          curl --fail --silent --show-error --location --compressed \
            --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H 'Cache-Control: no-cache' \
            -H 'User-Agent: AthrecsReleaseCheck/1.0' \
            'https://www.athrecs.com/?release-baseline=2026-08-24' \
            -o artifacts/production-home.html
          test -s artifacts/production-home.html

      - name: Extract and record public catalogue counts
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from hashlib import sha256
          from html.parser import HTMLParser
          import json
          import re
          from pathlib import Path

          source = 'https://www.athrecs.com/'
          html_path = Path('artifacts/production-home.html')
          html_bytes = html_path.read_bytes()
          html = html_bytes.decode('utf-8', errors='replace')

          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
              def handle_data(self, data):
                  value = ' '.join(data.split())
                  if value:
                      self.parts.append(value)

          parser = Text()
          parser.feed(html)
          text = ' '.join(parser.parts)

          counts = {}
          for label in ('Events', 'Clubs', 'Athletes'):
              for pattern in (
                  rf'{label}\s+([0-9][0-9,]*)',
                  rf'([0-9][0-9,]*)\s+{label}',
              ):
                  match = re.search(pattern, text, re.IGNORECASE)
                  if match:
                      counts[label.lower()] = int(match.group(1).replace(',', ''))
                      break

          record = {
              'capturedAt': datetime.now(timezone.utc).isoformat(),
              'source': source,
              'counts': counts,
              'htmlBytes': len(html_bytes),
              'htmlSha256': sha256(html_bytes).hexdigest(),
          }
          print(json.dumps({**record, 'textPreview': text[:1200]}, indent=2))

          Path('artifacts/production-baseline.json').write_text(
              json.dumps(record, indent=2) + '\n', encoding='utf-8'
          )
          Path('docs/release-baselines/production-before-pr235.json').write_text(
              json.dumps(record, indent=2) + '\n', encoding='utf-8'
          )
          if set(counts) != {'events', 'clubs', 'athletes'}:
              raise SystemExit('Could not extract all three public homepage counts')
          PY

      - name: Commit audited baseline
        run: |
          git config user.name "Athrecs Release Automation"
          git config user.email "paultwbrowne@gmail.com"
          git add -- docs/release-baselines/production-before-pr235.json
          if git diff --cached --quiet; then
            echo "Baseline record is unchanged."
          else
            git commit -m "Record production catalogue baseline before PR 235"
            git push origin HEAD:codex/athrecs-stability-and-slugs
          fi

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athrecs-production-baseline
          path: artifacts/
          if-no-files-found: error
