name: Capture Athrecs production baseline

on:
  push:
    branches:
      - codex/athrecs-stability-and-slugs
    paths:
      - .github/workflows/capture-production-baseline.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch live public homepage
        run: |
          mkdir -p artifacts
          curl --fail --silent --show-error --location --compressed \
            --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H 'Cache-Control: no-cache' \
            -H 'User-Agent: AthrecsReleaseCheck/1.0' \
            'https://www.athrecs.com/?release-baseline=2026-08-24' \
            -o artifacts/production-home.html
          test -s artifacts/production-home.html

      - name: Extract public catalogue counts
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          import json
          import re
          from pathlib import Path

          path = Path('artifacts/production-home.html')
          html = path.read_text(encoding='utf-8', errors='replace')

          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
              def handle_data(self, data):
                  value = ' '.join(data.split())
                  if value:
                      self.parts.append(value)

          parser = Text()
          parser.feed(html)
          text = ' '.join(parser.parts)

          counts = {}
          for label in ('Events', 'Clubs', 'Athletes'):
              patterns = (
                  rf'{label}\s+([0-9][0-9,]*)',
                  rf'([0-9][0-9,]*)\s+{label}',
              )
              for pattern in patterns:
                  match = re.search(pattern, text, re.IGNORECASE)
                  if match:
                      counts[label.lower()] = int(match.group(1).replace(',', ''))
                      break

          print(json.dumps({
              'html_bytes': len(html.encode('utf-8')),
              'counts': counts,
              'text_preview': text[:1200],
          }, indent=2))

          Path('artifacts/production-baseline.json').write_text(
              json.dumps({'counts': counts}, indent=2) + '\n',
              encoding='utf-8',
          )
          if set(counts) != {'events', 'clubs', 'athletes'}:
              print('Could not extract all three public homepage counts.')
              raise SystemExit(1)
          PY

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athrecs-production-baseline
          path: artifacts/
          if-no-files-found: error
