name: Apply private athlete profile route tree

on:
  push:
    branches:
      - codex/improve-result-claim-experience
    paths:
      - .github/workflows/apply-private-profile-route-tree.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/improve-result-claim-experience
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update committed route tree
        run: node scripts/apply-private-profile-route-tree.mjs
      - name: Remove one-off route-tree helpers
        run: |
          rm scripts/apply-private-profile-route-tree.mjs
          rm .github/workflows/apply-private-profile-route-tree.yml
      - name: Commit generated route tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No route-tree changes"
          else
            git commit -m "Register private athlete profile route"
            git push origin HEAD:codex/improve-result-claim-experience
          fi
