name: Live Run Norwich batch 3 verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check production endpoints and content
        shell: bash
        run: |
          set -euo pipefail

          base="https://athrecs-comsite.vercel.app"
          work="${RUNNER_TEMP}/athrecs-live-b3"
          mkdir -p "$work"

          fetch_page() {
            local label="$1"
            local path="$2"
            local output="$work/${label}.html"
            local code

            code="$(curl \
              --location \
              --silent \
              --show-error \
              --retry 8 \
              --retry-delay 8 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 240 \
              --output "$output" \
              --write-out '%{http_code}' \
              "${base}${path}")"

            bytes="$(wc -c < "$output" | tr -d ' ')"
            printf '%s\t%s\t%s bytes\t%s%s\n' "$label" "$code" "$bytes" "$base" "$path"
            test "$code" = "200"
            test "$bytes" -gt 500
          }

          # The first request also gives the new seed version an opportunity to run.
          fetch_page home "/"
          fetch_page athletes "/athletes"
          fetch_page phoenix "/athletes/phoenix-tashlin-clifford"
          fetch_page juliette "/athletes/juliette-watkinson"
          fetch_page aaron "/athletes/aaron-odriscoll"
          fetch_page ellen "/athletes/ellen-jack"
          fetch_page marc "/athletes/marc-evans"

          python3 - "$work" <<'PY'
          import html
          import json
          import pathlib
          import re
          import sys

          work = pathlib.Path(sys.argv[1])

          def read(name: str) -> tuple[str, str]:
              raw = (work / f"{name}.html").read_text(encoding="utf-8", errors="replace")
              visible = html.unescape(re.sub(r"<[^>]+>", " ", raw))
              visible = re.sub(r"\s+", " ", visible)
              return raw, visible

          athletes_raw, athletes_text = read("athletes")
          if not re.search(r"(?<!\d)465(?!\d)", athletes_raw):
              raise AssertionError(
                  "The live /athletes response does not contain the expected catalogue count 465"
              )

          samples = {
              "phoenix": ("Phoenix Tashlin Clifford", "40:47"),
              "juliette": ("Juliette Watkinson", "41:04"),
              "aaron": ("Aaron O’driscoll", "41:51"),
              "ellen": ("Ellen Jack", "41:50"),
              "marc": ("Marc Evans", "41:50"),
          }
          for filename, (name, time) in samples.items():
              raw, visible = read(filename)
              if name.casefold() not in visible.casefold() and name.casefold() not in raw.casefold():
                  # Allow the straight-apostrophe rendering of Aaron's name.
                  alternate = name.replace("’", "'")
                  if alternate.casefold() not in visible.casefold() and alternate.casefold() not in raw.casefold():
                      raise AssertionError(f"{name} is missing from the live profile response")
              if time not in raw and time not in visible:
                  raise AssertionError(
                      f"Official Run Norwich time {time} is missing from {name}'s live profile"
                  )

          result = {
              "base_url": "https://athrecs-comsite.vercel.app",
              "home_status": 200,
              "athletes_status": 200,
              "athlete_count": 465,
              "sample_profiles": {
                  "phoenix-tashlin-clifford": {"status": 200, "time": "40:47"},
                  "juliette-watkinson": {"status": 200, "time": "41:04"},
                  "aaron-odriscoll": {"status": 200, "time": "41:51"},
                  "ellen-jack": {"status": 200, "time": "41:50"},
                  "marc-evans": {"status": 200, "time": "41:50"},
              },
          }
          output = work / "live-verification-b3.json"
          output.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(output.read_text(encoding="utf-8"))
          PY

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: live-rn2025-b3-verification
          path: ${{ runner.temp }}/athrecs-live-b3/live-verification-b3.json
          if-no-files-found: error
          retention-days: 1
