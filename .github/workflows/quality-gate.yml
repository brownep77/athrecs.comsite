name: Athrecs quality gate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/athrecs_ci
      # Deliberately omit Resend. Browser coverage must prove that account
      # creation and email/password sign-in stay visible without mail delivery.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athrecs_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athrecs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Intercom identity and account session isolation
        run: npm run verify:intercom

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Intercom welcome displays on desktop and mobile
        run: npm run verify:intercom-welcome

      - name: Race weather timezones, missing data and compact layout
        run: |
          python scripts/verify-race-weather.py
          node scripts/verify-race-weather.mjs

      - name: Verify profile setup, former clubs and staff alerts on mobile and desktop
        run: node --experimental-strip-types scripts/verify-profile-setup.mjs --browser

      - name: Quick sign-up and default result discovery
        run: |
          node scripts/verify-quick-signin-ui.mjs
          node scripts/verify-quick-signin-ui.mjs --no-email
          node scripts/verify-quick-signin-ui.mjs --runrecs

      - name: Social recruitment and sourced athlete profile
        run: node scripts/verify-recruitment-ui.mjs

      - name: Verify AI chat privacy, transcripts and usage limits
        run: |
          node --experimental-strip-types scripts/verify-assistant.mjs
          node scripts/verify-assistant-access.mjs

      - name: Verify World Athletics refresh preservation
        run: node scripts/verify-world-athletics-refresh.mjs

      - name: Verify public catalogue source policy and reviewed duplicates
        run: node --experimental-strip-types scripts/verify-public-catalogue-content.mjs

      - name: Withhold unconfirmed fixture distances
        run: node scripts/verify-fixture-distance-publication.mjs
      - name: Verify fixture geography, flag mappings and correction safety
        run: npm run verify:fixture-geography

      - name: Verify search URLs and sitemap privacy
        run: npm run verify:search-discovery

      - name: Verify sports directory coverage and jurisdiction filters
        run: node scripts/verify-sports-directory.mjs

      - name: Verify location race pages and automatic date rollover
        run: node scripts/verify-event-colours.mjs

      - name: Verify county additions and published start windows
        run: node --experimental-strip-types scripts/verify-county-deep-recheck.mjs

      - name: Verify athlete search metadata and crawlable directory pages
        run: |
          node scripts/verify-source-history-sport.mjs
          node scripts/verify-fixture-note-repair.mjs
          npm run verify:athlete-search-content
          node scripts/verify-page-biographies.mjs
          node scripts/verify-athlete-discovery-pagination.mjs
          node scripts/verify-public-career-discovery.mjs

      - name: Achievement progress and public profile pagination
        run: |
          node --experimental-strip-types scripts/verify-race-win-achievements.mjs
          node --experimental-strip-types scripts/verify-achievement-progress.mjs

      - name: Verify indexing recovery and archive privacy
        run: node scripts/verify-indexing-recovery.mjs

      - name: Verify race-page event structured data
        run: |
          node scripts/verify-race-page-schema.mjs
          node scripts/verify-event-offer-publication.mjs
          node scripts/verify-event-schema-publication.mjs
          node scripts/verify-public-results-section.mjs

      - name: Verify running event register and contact history
        run: node scripts/verify-event-register.mjs

      - name: Profile result verification ownership and evidence safeguards
        run: npm run verify:profile-result-verification

      - name: Reviewed source-verification batch safeguards
        run: npm run verify:source-verification-batch

      - name: Trackie high-jump status and nonfinish safeguards
        run: npm run verify:trackie-result-status

      - name: Verify historical result source safeguards
        run: |
          node scripts/verify-result-source-sync.mjs
          node scripts/verify-anz-import.mjs
          node scripts/verify-historical-personal-bests.mjs

      - name: Verify independent result evidence comparisons
        run: node scripts/verify-result-evidence-audit.mjs

      - name: Public-figure updates preserve retired event URLs
        run: |
          node scripts/verify-mo-farah-road-records.mjs
          node scripts/verify-public-figure-refresh.mjs
          node scripts/verify-reported-race-history.mjs

      - name: Verify consented feature flags in Web Analytics
        run: npm run verify:analytics-flags

      - name: Verify browser smoke heading assertions
        run: node scripts/verify-browser-smoke-assertions.mjs

      - name: Verify chat languages, mobile controls and transcript downloads
        run: node scripts/verify-assistant-browser.mjs

      - name: Staff collection stats, access controls and responsive tables
        run: npm run verify:collection-stats -- --browser

      - name: Club directory and representative registration
        run: npm run verify:club-registration && npm run verify:club-registration-browser && npm run verify:club-registration-flow

      - name: Published result counts on club profiles
        run: node scripts/verify-club-result-counts.mjs

      - name: Verified fixture file import browser check
        run: node scripts/verify-fixture-upload-ui.mjs

      - name: Registered athletes staff dashboard
        run: node scripts/verify-registrations.mjs --browser

      - name: Private client data, login diagnostics and failed-attempt history
        run: node scripts/verify-client-data.mjs --browser

      - name: Email-only sign-in form
        run: node scripts/verify-email-code-ui.mjs

      - name: Combined result discovery and confirmation safeguards
        run: |
          node scripts/verify-combined-result-groups.mjs
          node scripts/verify-result-conflict-flow.mjs

      - name: Type-check, lint and verify
        run: npm run ci:verify

      - name: Account results panel appears once on both sites
        run: |
          node scripts/verify-account-panel-ui.mjs
          node scripts/verify-account-panel-ui.mjs --runrecs

      - name: Collector Keep and Dismiss browser check
        run: node scripts/verify-collector-decisions-ui.mjs

      - name: Collector bulk publication browser check
        run: node scripts/verify-collector-bulk-ui.mjs

      - name: Collector distance selection browser check
        run: node scripts/verify-collector-distance-ui.mjs

      - name: Start browser smoke server and seed PostgreSQL
        run: |
          mkdir -p artifacts
          nohup npm run dev -- --force > artifacts/preview.log 2>&1 &
          echo $! > artifacts/preview.pid

          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8080/favicon.png > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat artifacts/preview.log
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 5); do
            if curl --fail --silent --show-error --max-time 180 \
              http://127.0.0.1:8080/sportsrecs > artifacts/sportsrecs-warm.html; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              cat artifacts/preview.log
              exit 1
            fi
            sleep 2
          done

      - name: Fixture geography on desktop and mobile
        run: node scripts/verify-fixture-geography-ui.mjs

      - name: Catalogue automation authentication smoke test
        run: |
          status=$(curl \
            --silent \
            --show-error \
            --max-time 30 \
            --output artifacts/catalogue-automation-unauthenticated.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"sourceKey":"athrecs-holding:delta:unauthenticated","events":[],"editions":[]}' \
            http://127.0.0.1:8080/api/catalogue-automation)
          if [ "$status" != "401" ]; then
            cat artifacts/catalogue-automation-unauthenticated.json
            echo "Expected HTTP 401, received $status"
            exit 1
          fi
          grep -F "OIDC bearer token is required" \
            artifacts/catalogue-automation-unauthenticated.json

          result_status=$(curl \
            --silent \
            --show-error \
            --max-time 30 \
            --output artifacts/result-automation-unauthenticated.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"sourceKey":"run_norwich_results","results":[]}' \
            'http://127.0.0.1:8080/api/catalogue-automation?mode=historical-results')
          if [ "$result_status" != "401" ]; then
            cat artifacts/result-automation-unauthenticated.json
            echo "Expected historical result HTTP 401, received $result_status"
            exit 1
          fi
          grep -F "OIDC bearer token is required" \
            artifacts/result-automation-unauthenticated.json

      - name: Partnership pages and sign-in gates
        run: |
          BROWSER_SMOKE_EXPECT_TEXT='Give your brand more exposure||Brand registration is open||Register your brand' \
            node scripts/browser-smoke.mjs http://127.0.0.1:8080/brands "$GITHUB_WORKSPACE/artifacts/brands.png"
          BROWSER_SMOKE_VIEWPORT_WIDTH=390 \
          BROWSER_SMOKE_VIEWPORT_HEIGHT=844 \
          BROWSER_SMOKE_FULL_PAGE=1 \
          BROWSER_SMOKE_EXPECT_TEXT='Give your brand more exposure||Brand registration is open' \
            node scripts/browser-smoke.mjs http://127.0.0.1:8080/brands "$GITHUB_WORKSPACE/artifacts/brands-mobile.png"
          BROWSER_SMOKE_EXPECT_TEXT='Opportunities for your next chapter||No open opportunities yet' \
            node scripts/browser-smoke.mjs http://127.0.0.1:8080/opportunities "$GITHUB_WORKSPACE/artifacts/opportunities.png"
          BROWSER_SMOKE_EXPECT_TEXT='Register your brand||Sign in to continue||Sign in or create account' \
            node scripts/browser-smoke.mjs http://127.0.0.1:8080/brands/register "$GITHUB_WORKSPACE/artifacts/brand-registration.png"
          BROWSER_SMOKE_EXPECT_TEXT='Your brand dashboard||Sign in to continue' \
            node scripts/browser-smoke.mjs http://127.0.0.1:8080/brands/manage "$GITHUB_WORKSPACE/artifacts/brand-dashboard.png"

          BROWSER_SMOKE_EXPECT_TEXT='Bring brands, athletes and influencers together.||Sign in to submit your enquiry' \
            node scripts/browser-smoke.mjs http://127.0.0.1:8080/sponsorship "$GITHUB_WORKSPACE/artifacts/sponsorship.png"
          BROWSER_SMOKE_VIEWPORT_WIDTH=390 \
          BROWSER_SMOKE_VIEWPORT_HEIGHT=844 \
          BROWSER_SMOKE_FULL_PAGE=1 \
          BROWSER_SMOKE_EXPECT_TEXT='Start a sponsorship enquiry||Sign in to submit your enquiry' \
            node scripts/browser-smoke.mjs http://127.0.0.1:8080/sponsorship "$GITHUB_WORKSPACE/artifacts/sponsorship-mobile.png"

      - name: Sponsorship enquiry round trip
        run: node scripts/browser-sponsorship-smoke.mjs http://127.0.0.1:8080/

      - name: Compact athlete profiles and achievements
        env:
          BROWSER_SMOKE_MEMBER: "1"
        run: |
          BROWSER_SMOKE_EXPECT_TEXT='Paul Browne||PBs||Achievements & milestones||Results||About & links' \
            node scripts/browser-smoke.mjs http://127.0.0.1:8080/athletes/paul-browne "$GITHUB_WORKSPACE/artifacts/paul-compact.png"
          BROWSER_SMOKE_VIEWPORT_WIDTH=390 \
          BROWSER_SMOKE_VIEWPORT_HEIGHT=844 \
          BROWSER_SMOKE_FULL_PAGE=1 \
          BROWSER_SMOKE_EXPECT_TEXT='Paul Browne||Achievements & milestones||Results||About & links' \
            node scripts/browser-smoke.mjs http://127.0.0.1:8080/athletes/paul-browne "$GITHUB_WORKSPACE/artifacts/paul-compact-mobile.png"
          BROWSER_SMOKE_EXPECT_TEXT='Harry Styles||Achievements & milestones||Results||About & links' \
            node scripts/browser-smoke.mjs http://127.0.0.1:8080/athletes/harry-styles "$GITHUB_WORKSPACE/artifacts/harry-compact.png"

      - name: Browser smoke tests
        run: |
          BROWSER_SMOKE_FULL_PAGE=1 \
          BROWSER_SMOKE_EXPECT_TEXT='One sporting identity.||Every competition.||AthRecs||Coming soon' \
          BROWSER_SMOKE_REJECT_TEXT='Help improve ATHRECS' \
            node scripts/browser-smoke.mjs \
              http://127.0.0.1:8080/sportsrecs \
              "$GITHUB_WORKSPACE/artifacts/sportsrecs.png"

          BROWSER_SMOKE_FULL_PAGE=1 \
          BROWSER_SMOKE_VIEWPORT_WIDTH=390 \
          BROWSER_SMOKE_VIEWPORT_HEIGHT=844 \
          BROWSER_SMOKE_EXPECT_TEXT='One sporting identity.||Every competition.||AthRecs||Coming soon' \
          BROWSER_SMOKE_REJECT_TEXT='Help improve ATHRECS' \
            node scripts/browser-smoke.mjs \
              http://127.0.0.1:8080/sportsrecs \
              "$GITHUB_WORKSPACE/artifacts/sportsrecs-mobile.png"

          BROWSER_SMOKE_FULL_PAGE=1 \
          BROWSER_SMOKE_EXPECT_TEXT='Find your next running race||Explore by place||More countries||Month||Distance||Find my results' \
          BROWSER_SMOKE_REJECT_TEXT='Upcoming athletics||Browse verified athletics fixtures' \
          BROWSER_SMOKE_REJECT_HEADING='Event calendar' \
            node scripts/browser-smoke.mjs http://127.0.0.1:8080/ "$GITHUB_WORKSPACE/artifacts/home.png"
          BROWSER_SMOKE_VIEWPORT_WIDTH=390 \
          BROWSER_SMOKE_VIEWPORT_HEIGHT=844 \
          BROWSER_SMOKE_FULL_PAGE=1 \
          BROWSER_SMOKE_EXPECT_TEXT='Find your next running race||Month||Distance||Find my results' \
          BROWSER_SMOKE_REJECT_TEXT='Upcoming athletics||Browse verified athletics fixtures' \
          BROWSER_SMOKE_REJECT_HEADING='Event calendar' \
            node scripts/browser-smoke.mjs http://127.0.0.1:8080/ "$GITHUB_WORKSPACE/artifacts/home-mobile.png"
          BROWSER_SMOKE_EXPECT_TEXT='Explore athlete profiles||Sport in results' \
          BROWSER_SMOKE_REJECT_TEXT='Sign in to view athlete profiles' \
            node scripts/browser-smoke.mjs 'http://127.0.0.1:8080/athletes?country=Ireland' "$GITHUB_WORKSPACE/artifacts/athletes.png"
          BROWSER_SMOKE_MEMBER=1 \
          BROWSER_SMOKE_EXPECT_TEXT='Explore athlete profiles||Sport in results' \
            node scripts/browser-smoke.mjs 'http://127.0.0.1:8080/athletes?country=Ireland' "$GITHUB_WORKSPACE/artifacts/athletes-member.png"
          BROWSER_SMOKE_EXPECT_TEXT='Find your next event||AthRecs||World Triathlon||Coming soon' \
            node scripts/browser-smoke.mjs http://127.0.0.1:8080/find-events "$GITHUB_WORKSPACE/artifacts/find-events.png"
          node scripts/browser-auth-smoke.mjs http://127.0.0.1:8080/ "$GITHUB_WORKSPACE/artifacts/athlete-auth.png"
          node scripts/browser-smoke.mjs "http://127.0.0.1:8080/races?sport=Athletics&surface=XC" "$GITHUB_WORKSPACE/artifacts/races.png"
          node scripts/browser-smoke.mjs \
            http://127.0.0.1:8080/races/ea-uk-fixtures-wirral-primary-schools-cross-country-series-supported-by-wirral-ac \
            "$GITHUB_WORKSPACE/artifacts/athletics-event.png"

          boston_status=$(curl \
            --silent \
            --show-error \
            --max-time 30 \
            --output artifacts/boston-marathon.html \
            --write-out '%{http_code}' \
            http://127.0.0.1:8080/races/boston-marathon)
          if [ "$boston_status" != "200" ]; then
            cat artifacts/boston-marathon.html
            echo "Expected consolidated Boston Marathon route to return 200, received $boston_status"
            exit 1
          fi

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athrecs-browser-smoke
          path: artifacts/
          if-no-files-found: warn
