name: Athrecs quality gate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/athrecs_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athrecs_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athrecs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check, lint and verify
        run: npm run ci:verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start browser smoke server and seed PostgreSQL
        run: |
          mkdir -p artifacts
          nohup npm run dev > artifacts/preview.log 2>&1 &
          echo $! > artifacts/preview.pid

          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8080/favicon.ico > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat artifacts/preview.log
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error --max-time 900 \
            http://127.0.0.1:8080/ > artifacts/home-warm.html || {
              cat artifacts/preview.log
              exit 1
            }

      - name: Browser smoke tests
        run: |
          node scripts/browser-smoke.mjs http://127.0.0.1:8080/ "$GITHUB_WORKSPACE/artifacts/home.png"
          node scripts/browser-smoke.mjs "http://127.0.0.1:8080/races?sport=Running&distance=10K" "$GITHUB_WORKSPACE/artifacts/races.png"
          node scripts/browser-smoke.mjs http://127.0.0.1:8080/races/boston-marathon "$GITHUB_WORKSPACE/artifacts/boston-marathon.png"

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athrecs-browser-smoke
          path: artifacts/
          if-no-files-found: warn
