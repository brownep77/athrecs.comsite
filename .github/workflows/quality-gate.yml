name: Athrecs quality gate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/athrecs_ci
      # Deliberately omit Resend. Browser coverage must prove that account
      # creation and email/password sign-in stay visible without mail delivery.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athrecs_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athrecs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check, lint and verify
        run: npm run ci:verify

      - name: Verify historical result source safeguards
        run: node scripts/verify-result-source-sync.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start browser smoke server and seed PostgreSQL
        run: |
          mkdir -p artifacts
          nohup npm run dev -- --force > artifacts/preview.log 2>&1 &
          echo $! > artifacts/preview.pid

          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8080/favicon.png > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat artifacts/preview.log
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 5); do
            if curl --fail --silent --show-error --max-time 180 \
              http://127.0.0.1:8080/sportsrecs > artifacts/sportsrecs-warm.html; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              cat artifacts/preview.log
              exit 1
            fi
            sleep 2
          done

      - name: Catalogue automation authentication smoke test
        run: |
          status=$(curl \
            --silent \
            --show-error \
            --max-time 30 \
            --output artifacts/catalogue-automation-unauthenticated.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"sourceKey":"athrecs-holding:delta:unauthenticated","events":[],"editions":[]}' \
            http://127.0.0.1:8080/api/catalogue-automation)
          if [ "$status" != "401" ]; then
            cat artifacts/catalogue-automation-unauthenticated.json
            echo "Expected HTTP 401, received $status"
            exit 1
          fi
          grep -F "OIDC bearer token is required" \
            artifacts/catalogue-automation-unauthenticated.json

          result_status=$(curl \
            --silent \
            --show-error \
            --max-time 30 \
            --output artifacts/result-automation-unauthenticated.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"sourceKey":"run_norwich_results","results":[]}' \
            'http://127.0.0.1:8080/api/catalogue-automation?mode=historical-results')
          if [ "$result_status" != "401" ]; then
            cat artifacts/result-automation-unauthenticated.json
            echo "Expected historical result HTTP 401, received $result_status"
            exit 1
          fi
          grep -F "OIDC bearer token is required" \
            artifacts/result-automation-unauthenticated.json

      - name: Browser smoke tests
        run: |
          BROWSER_SMOKE_FULL_PAGE=1 node scripts/browser-smoke.mjs \
            http://127.0.0.1:8080/sportsrecs \
            "$GITHUB_WORKSPACE/artifacts/sportsrecs.png"
          node scripts/browser-smoke.mjs http://127.0.0.1:8080/ "$GITHUB_WORKSPACE/artifacts/home.png"
          node scripts/browser-auth-smoke.mjs http://127.0.0.1:8080/ "$GITHUB_WORKSPACE/artifacts/athlete-auth.png"
          node scripts/browser-smoke.mjs "http://127.0.0.1:8080/races?sport=Athletics&surface=XC" "$GITHUB_WORKSPACE/artifacts/races.png"
          node scripts/browser-smoke.mjs \
            http://127.0.0.1:8080/races/ea-uk-fixtures-wirral-primary-schools-cross-country-series-supported-by-wirral-ac \
            "$GITHUB_WORKSPACE/artifacts/athletics-event.png"

          boston_status=$(curl \
            --silent \
            --show-error \
            --max-time 30 \
            --output artifacts/boston-marathon-not-found.html \
            --write-out '%{http_code}' \
            http://127.0.0.1:8080/races/boston-marathon)
          if [ "$boston_status" != "404" ]; then
            cat artifacts/boston-marathon-not-found.html
            echo "Expected non-Athletics Boston Marathon route to return 404, received $boston_status"
            exit 1
          fi

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athrecs-browser-smoke
          path: artifacts/
          if-no-files-found: warn
