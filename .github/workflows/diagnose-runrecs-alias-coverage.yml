name: Diagnose RunRecs alias coverage

on:
  push:
    branches:
      - diagnose/runrecs-alias-coverage
    paths:
      - .github/workflows/diagnose-runrecs-alias-coverage.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diagnose/runrecs-alias-coverage

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Map every missing canonical slug to its source file
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify-fixture-duplicates.mjs")
          text = path.read_text(encoding="utf-8")
          old = '''for (const [alias, canonical] of Object.entries(verifiedFixtureAliases)) {
            assert(!seriesBySlug.has(alias), `Retired duplicate remains in catalogue: ${alias}`);
            assert(seriesBySlug.has(canonical), `Duplicate alias has no canonical event: ${canonical}`);
          }
          '''
          new = '''const missingAliasCanonicals = Object.entries(verifiedFixtureAliases)
            .filter(([, canonical]) => !seriesBySlug.has(canonical))
            .map(([alias, canonical]) => ({ alias, canonical }));
          const { writeFileSync } = await import("node:fs");
          writeFileSync("/tmp/missing-alias-canonicals.json", JSON.stringify(missingAliasCanonicals));
          process.exit(0);
          '''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one alias assertion block; found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          node --experimental-strip-types scripts/verify-fixture-duplicates.mjs

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          missing = json.loads(Path("/tmp/missing-alias-canonicals.json").read_text())
          files = list(Path("src/data").glob("*.ts"))
          report = []
          for row in missing:
              canonical = row["canonical"]
              patterns = [
                  re.compile(r'\bslug\s*:\s*["\']' + re.escape(canonical) + r'["\']'),
                  re.compile(r'["\']slug["\']\s*:\s*["\']' + re.escape(canonical) + r'["\']'),
              ]
              matches = []
              for file in files:
                  text = file.read_text(encoding="utf-8")
                  if any(pattern.search(text) for pattern in patterns):
                      matches.append(str(file))
              report.append({**row, "source_files": matches})
          print("ALIAS_CANONICAL_SOURCE_MAP=" + json.dumps(report, separators=(",", ":")))
          PY
