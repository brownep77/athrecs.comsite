name: Diagnose RunRecs alias coverage

on:
  push:
    branches:
      - diagnose/runrecs-alias-coverage
    paths:
      - .github/workflows/diagnose-runrecs-alias-coverage.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diagnose/runrecs-alias-coverage

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test alias assertions against the merged catalogue
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify-fixture-duplicates.mjs")
          text = path.read_text(encoding="utf-8")

          destructure = '''const [
            { seriesList: coreSeries },'''
          destructure_replacement = '''const [
            { seriesList: catalogueSeries },
            { seriesList: coreSeries },'''
          if text.count(destructure) != 1:
              raise SystemExit(f"Expected one import destructure anchor; found {text.count(destructure)}")
          text = text.replace(destructure, destructure_replacement, 1)

          imports = '''] = await Promise.all([
            import("../src/data/series.ts"),'''
          imports_replacement = '''] = await Promise.all([
            import("../src/data/catalogue.ts"),
            import("../src/data/series.ts"),'''
          if text.count(imports) != 1:
              raise SystemExit(f"Expected one Promise.all import anchor; found {text.count(imports)}")
          text = text.replace(imports, imports_replacement, 1)

          map_anchor = '''const seriesBySlug = new Map(seriesList.map((series) => [series.slug, series]));
          for (const [alias, canonical] of Object.entries(verifiedFixtureAliases)) {
            assert(!seriesBySlug.has(alias), `Retired duplicate remains in catalogue: ${alias}`);
            assert(seriesBySlug.has(canonical), `Duplicate alias has no canonical event: ${canonical}`);
          }'''
          map_replacement = '''const seriesBySlug = new Map(seriesList.map((series) => [series.slug, series]));
          const catalogueSeriesBySlug = new Map(
            catalogueSeries.map((series) => [series.slug, series]),
          );
          for (const [alias, canonical] of Object.entries(verifiedFixtureAliases)) {
            assert(!catalogueSeriesBySlug.has(alias), `Retired duplicate remains in catalogue: ${alias}`);
            assert(
              catalogueSeriesBySlug.has(canonical),
              `Duplicate alias has no canonical event: ${canonical}`,
            );
          }'''
          if text.count(map_anchor) != 1:
              raise SystemExit(f"Expected one alias map block; found {text.count(map_anchor)}")
          text = text.replace(map_anchor, map_replacement, 1)

          path.write_text(text, encoding="utf-8")
          PY
          npm run verify:fixture-duplicates
