name: Diagnose RunRecs alias coverage

on:
  push:
    branches:
      - diagnose/runrecs-alias-coverage
    paths:
      - .github/workflows/diagnose-runrecs-alias-coverage.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diagnose/runrecs-alias-coverage

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test narrow alias source coverage fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify-fixture-duplicates.mjs")
          text = path.read_text(encoding="utf-8")

          destructure_anchor = '''  { englandAthleticsUkFixturesEditions, englandAthleticsUkFixturesSeries },
          marathonOptions,'''
          destructure_replacement = '''  { englandAthleticsUkFixturesEditions, englandAthleticsUkFixturesSeries },
          { runrecsGapFillSeries },
          { ukFiveKSeries },
          marathonOptions,'''
          if text.count(destructure_anchor) != 1:
              raise SystemExit(f"Expected one destructuring anchor; found {text.count(destructure_anchor)}")
          text = text.replace(destructure_anchor, destructure_replacement, 1)

          import_anchor = '''  import("../src/data/england-athletics-uk-fixtures.ts"),
          import("../src/data/entry-options-uk-marathons.ts"),'''
          import_replacement = '''  import("../src/data/england-athletics-uk-fixtures.ts"),
          import("../src/data/runrecs-gap-fill-2026-09.ts"),
          import("../src/data/uk-5k-races.ts"),
          import("../src/data/entry-options-uk-marathons.ts"),'''
          if text.count(import_anchor) != 1:
              raise SystemExit(f"Expected one import anchor; found {text.count(import_anchor)}")
          text = text.replace(import_anchor, import_replacement, 1)

          alias_anchor = '''const seriesBySlug = new Map(seriesList.map((series) => [series.slug, series]));
          for (const [alias, canonical] of Object.entries(verifiedFixtureAliases)) {
            assert(!seriesBySlug.has(alias), `Retired duplicate remains in catalogue: ${alias}`);
            assert(seriesBySlug.has(canonical), `Duplicate alias has no canonical event: ${canonical}`);
          }'''
          alias_replacement = '''const seriesBySlug = new Map(seriesList.map((series) => [series.slug, series]));
          const aliasCanonicalSeriesBySlug = new Map(
            [...seriesList, ...runrecsGapFillSeries, ...ukFiveKSeries].map((series) => [
              series.slug,
              series,
            ]),
          );
          for (const [alias, canonical] of Object.entries(verifiedFixtureAliases)) {
            assert(!seriesBySlug.has(alias), `Retired duplicate remains in catalogue: ${alias}`);
            assert(
              aliasCanonicalSeriesBySlug.has(canonical),
              `Duplicate alias has no canonical event: ${canonical}`,
            );
          }'''
          if text.count(alias_anchor) != 1:
              raise SystemExit(f"Expected one alias assertion block; found {text.count(alias_anchor)}")
          text = text.replace(alias_anchor, alias_replacement, 1)

          path.write_text(text, encoding="utf-8")
          PY

          npm run verify:fixture-duplicates
