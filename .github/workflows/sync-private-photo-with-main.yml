name: Sync private profile photo feature with main

on:
  push:
    branches:
      - codex/private-athlete-profile-photo
    paths:
      - .github/workflows/sync-private-photo-with-main.yml

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athrecs_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athrecs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/athrecs_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/private-athlete-profile-photo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Merge current main without losing either quality gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          node scripts/sync-private-photo-with-main.mjs
          git add package.json
          unresolved=$(git diff --name-only --diff-filter=U)
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge paths:"
            echo "$unresolved"
            exit 1
          fi
          if [ "$merge_status" -ne 0 ]; then
            echo "Merge conflict was resolved deterministically."
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete merged quality gate
        run: npm run ci:verify
      - name: Remove one-off sync helpers
        run: |
          rm scripts/sync-private-photo-with-main.mjs
          rm .github/workflows/sync-private-photo-with-main.yml
      - name: Commit synchronized feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Merge current main into private profile photo feature"
          git push origin HEAD:codex/private-athlete-profile-photo
