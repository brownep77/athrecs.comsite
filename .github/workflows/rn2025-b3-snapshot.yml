name: Run Norwich batch 3 verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate batch 3 files
        run: python3 scripts/generate-rn2025-b3.py

      - name: Make backup checksum verification conditional
        run: python3 scripts/patch-rn2025-b3-verifier.py

      - name: Check generated diff
        run: git diff --check

      - name: Verify catalogue
        run: npm run verify:catalogue

      - name: Typecheck, allowing only the known main-branch route-link error
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi

          expected='src/components/clubs/ClubVerificationBadge.tsx(75,7): error TS2322: Type '\''"/clubs/verification"'\'' is not assignable to type '\''"/" | "/races" | "/athletes" | "/clubs" | "/calendar" | "/admin" | "/athletes/$slug" | "/clubs/$slug" | "/races/$slug" | "/api/auth/$" | "." | ".."'\''.'
          errors="$(grep 'error TS' /tmp/typecheck.log || true)"

          if [[ "$errors" != "$expected" ]]; then
            echo "Unexpected TypeScript errors were found:" >&2
            printf '%s\n' "$errors" >&2
            exit "$status"
          fi

          echo "Only the pre-existing ClubVerificationBadge route-link typing error was found."

      - name: Build
        run: npm run build

      - name: Commit verified batch files to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            src/data/athletes-rn2025-b3.ts
            src/data/results-rn2025-b3.ts
            src/data/catalogue.ts
            src/data/results.ts
            src/data/catalogue-metadata.ts
            scripts/verify-catalogue.mjs
            src/lib/athrecs/seed.server.ts
          )

          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo "Batch files are already committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "Complete Run Norwich 2025 batch 3"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
