name: Apply website-only Athlete Profile photo source

on:
  push:
    branches:
      - codex/website-only-profile-photo
    paths:
      - .github/workflows/apply-website-only-profile-photo.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athrecs_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athrecs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/athrecs_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/website-only-profile-photo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply website-only photo source
        run: node scripts/apply-website-only-profile-photo.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete quality gate
        run: npm run ci:verify
      - name: Remove one-off helpers
        run: |
          rm scripts/apply-website-only-profile-photo.mjs
          rm .github/workflows/apply-website-only-profile-photo.yml
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use website uploads only for Athlete Profile photos"
          git push origin HEAD:codex/website-only-profile-photo
