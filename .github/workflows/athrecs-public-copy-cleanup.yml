name: One-shot ATHRECS Athletics public-copy cleanup

on:
  push:
    branches:
      - feat/athrecs-athletics-only

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[athrecs-copy-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/athrecs-athletics-only
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Remove references to unrelated sports from public ATHRECS copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('src/athrecs/routes/index.tsx')
          text = home.read_text()
          before = 'The public ATHRECS catalogue now excludes Running, Parkrun and every non-Athletics sport. Existing privacy and result-claim controls remain in place.'
          after = 'The public ATHRECS catalogue contains Athletics records only. Existing privacy and result-claim controls remain in place.'
          if before not in text:
              raise SystemExit('Expected homepage scope sentence was not found')
          home.write_text(text.replace(before, after, 1))

          verify = Path('scripts/verify-athrecs-athletics-only.mjs')
          text = verify.read_text()
          before = '["Cycling", "Triathlon", "Swimming", "Gymnastics", "Hyrox", "CrossFit"]'
          after = '["Running", "Parkrun", "Cycling", "Triathlon", "Swimming", "Gymnastics", "Hyrox", "CrossFit"]'
          if before not in text:
              raise SystemExit('Expected public-copy forbidden-sports list was not found')
          verify.write_text(text.replace(before, after, 1))
          PY
      - name: Re-run release checks
        run: |
          npm run verify:athrecs-athletics-only
          npm run typecheck
          npm run lint
          VITE_SITE_BRAND=athletics npm run build 2>&1 | tee /tmp/athrecs-athletics-build.log
          grep -F "[athrecs] athletics-only public build enabled" /tmp/athrecs-athletics-build.log
      - name: Commit cleanup
        run: |
          git config user.name "athrecs-ci"
          git config user.email "athrecs-ci@users.noreply.github.com"
          git add src/athrecs/routes/index.tsx scripts/verify-athrecs-athletics-only.mjs
          git commit -m "Keep public ATHRECS copy Athletics-only [athrecs-copy-clean]"
          git push origin HEAD:feat/athrecs-athletics-only
