name: Repair remaining-race publisher

on:
  push:
    branches:
      - release/all-remaining-race-additions-2026-08-28

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'brownep77'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/all-remaining-race-additions-2026-08-28
      - name: Support verified edition overrides that add a new distance row
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/publish-remaining-uk-ireland-race-additions.mjs')
          text = path.read_text()

          helper_anchor = '''function dedupeBy(items, keyFor) {
            return [...new Map(items.map((item) => [keyFor(item), item])).values()];
          }
          '''
          helper_replacement = '''function dedupeBy(items, keyFor) {
            return [...new Map(items.map((item) => [keyFor(item), item])).values()];
          }

          function distanceKmFor(label) {
            const exact = {
              "5K": 5,
              "10K": 10,
              Half: 21.0975,
            };
            const known = exact[label];
            if (known) return known;
            const kmMatch = label.match(/^(\\d+(?:\\.\\d+)?)K$/i);
            if (kmMatch) return Number(kmMatch[1]);
            throw new Error(`Cannot infer distance kilometres for ${label}`);
          }
          '''
          if helper_anchor not in text:
              raise SystemExit('Could not locate publisher helper insertion point')
          text = text.replace(helper_anchor, helper_replacement, 1)

          old = '''    if (!base) throw new Error(`Reviewed source edition is missing: ${sourceKey}`);
              const effective = {
                ...base,
                ...override,
                seriesSlug: resolvedSlug,
                date: effectiveDate,
                distance: effectiveDistance,
              };
              const options = entryData.entryOptions?.[sourceKey] ?? effective.entryOptions;
              return {
                ...effective,
                ...(options?.length ? { entryOptions: options } : {}),
              };
          '''
          new = '''    const series = seriesBySlug.get(resolvedSlug);
              if (!series) throw new Error(`Reviewed race series is missing: ${resolvedSlug}`);
              const fallbackOptions = override.entryUrl
                ? [
                    {
                      providerCode: `official-${resolvedSlug}-${effectiveDate}-${effectiveDistance.toLowerCase().replace(/[^a-z0-9]+/g, "-")}`,
                      providerName: `${series.name} official entry`,
                      entryUrl: override.entryUrl,
                      entryType: "official",
                      status:
                        override.status === "Closed"
                          ? "closed"
                          : override.status === "TBC"
                            ? "unknown"
                            : "open",
                      checkedAt: "2026-08-28",
                      sourceUrl: override.source ?? override.entryUrl,
                      isVerified: true,
                      isPrimary: true,
                    },
                  ]
                : undefined;
              const effective = base
                ? {
                    ...base,
                    ...override,
                    seriesSlug: resolvedSlug,
                    date: effectiveDate,
                    distance: effectiveDistance,
                  }
                : {
                    seriesSlug: resolvedSlug,
                    date: effectiveDate,
                    distance: effectiveDistance,
                    distanceKm: distanceKmFor(effectiveDistance),
                    status: override.status ?? (override.entryUrl ? "Open" : "TBC"),
                    ...override,
                    source: override.source ?? series.source_url ?? series.website,
                    notes:
                      override.notes ??
                      `Verified ${effectiveDistance} edition published from the reviewed official event source.`,
                    publishAllDistances: true,
                  };
              const options =
                entryData.entryOptions?.[sourceKey] ?? effective.entryOptions ?? fallbackOptions;
              return {
                ...effective,
                ...(options?.length ? { entryOptions: options } : {}),
              };
          '''
          if old not in text:
              raise SystemExit('Could not locate edition resolution block')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify publication path
        run: |
          npm ci
          npm run typecheck
          npm run verify:uk-10k-workflow

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ATHRECS Release Automation"
          git config user.email "paultwbrowne@gmail.com"
          rm .github/workflows/fix-remaining-race-publisher.yml
          git add -A
          git commit -m "Publish verified checkpoint distances missing from the legacy core seed"
          git push origin HEAD:release/all-remaining-race-additions-2026-08-28
